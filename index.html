<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Duo Lock Screen</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
}

body {
    position: fixed;
    inset: 0;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}


/* Permission screen */

#permission {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 30px;

    background: #000;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        sans-serif;

    text-align: center;
}

#permission h1 {
    margin: 0 0 12px;

    font-size: 28px;
    font-weight: 600;
}

#permission p {
    max-width: 300px;

    margin: 0 0 28px;

    font-size: 15px;
    line-height: 1.5;

    opacity: .6;
}

#start {
    border: 0;
    outline: none;

    padding: 14px 26px;

    border-radius: 999px;

    background: #fff;
    color: #000;

    font-size: 16px;
    font-weight: 600;
}

#start:active {
    transform: scale(.97);
}


/* Recalibrate */

#recalibrate {
    position: fixed;

    z-index: 50;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    display: none;

    border: 0;
    outline: none;

    padding: 9px 16px;

    border-radius: 999px;

    background: rgba(0,0,0,.45);

    color: rgba(255,255,255,.85);

    backdrop-filter: blur(10px);

    font-size: 12px;
}


/* Error */

#error {
    position: fixed;

    z-index: 200;

    left: 20px;
    right: 20px;
    bottom: 20px;

    display: none;

    padding: 15px;

    border-radius: 12px;

    background: #300;

    color: #fff;

    font-family: monospace;

    font-size: 12px;

    line-height: 1.4;

    word-break: break-word;
}

</style>

</head>


<body>


<div id="permission">

    <h1>Duo Effect</h1>

    <p>
        Hold your iPhone normally,
        then enable motion to control
        the Duo-style screen effect.
    </p>

    <button id="start">
        Enable Motion
    </button>

</div>


<canvas id="canvas"></canvas>


<button id="recalibrate">
    Recalibrate
</button>


<div id="error"></div>


<script>


/* =========================================================
   ERROR DISPLAY
   ========================================================= */

const errorBox =
    document.getElementById("error");


function showError(message) {

    console.error(message);

    errorBox.textContent =
        "Error: " + message;

    errorBox.style.display =
        "block";
}


/* =========================================================
   CANVAS
   ========================================================= */

const canvas =
    document.getElementById("canvas");


const gl =
    canvas.getContext(
        "webgl",
        {
            alpha: false,
            antialias: false,
            premultipliedAlpha: false
        }
    );


if (!gl) {

    showError(
        "WebGL is not supported on this iPhone/browser."
    );

}


/* =========================================================
   VERTEX SHADER
   ========================================================= */

const vertexShaderSource = `

attribute vec2 a_position;

varying vec2 v_uv;

void main() {

    v_uv =
        a_position * 0.5 +
        0.5;

    gl_Position =
        vec4(
            a_position,
            0.0,
            1.0
        );
}

`;


/* =========================================================
   FRAGMENT SHADER
   ========================================================= */

const fragmentShaderSource = `

precision highp float;

varying vec2 v_uv;


/* Texture */

uniform sampler2D u_image;


/* Screen */

uniform float u_aspect;

uniform float u_imageAspect;


/* Fold */

uniform float u_angle;

uniform float u_hinge;


/* Physics */

uniform float u_eyeDistance;

uniform float u_blurPerUnit;

uniform float u_maxBlur;

uniform float u_darkenPerUnit;

uniform float u_maxDarken;


/* Resolution */

uniform vec2 u_resolution;


/* =========================================================
   COVER IMAGE
   ========================================================= */

vec2 getImageUV(vec2 uv) {

    float screenAspect =
        u_aspect;

    float imageAspect =
        u_imageAspect;

    vec2 scale =
        vec2(1.0);


    if (
        screenAspect >
        imageAspect
    ) {

        scale.y =
            imageAspect /
            screenAspect;

    }

    else {

        scale.x =
            screenAspect /
            imageAspect;

    }


    return
        (uv - 0.5)
        * scale
        + 0.5;
}


/* =========================================================
   IMAGE SAMPLE
   ========================================================= */

vec4 sampleImage(vec2 uv) {

    vec2 p =
        getImageUV(uv);


    if (
        p.x < 0.0 ||
        p.x > 1.0 ||
        p.y < 0.0 ||
        p.y > 1.0
    ) {

        return vec4(0.0);
    }


    return texture2D(
        u_image,
        p
    );
}


/* =========================================================
   BLUR
   ========================================================= */

vec4 blurImage(
    vec2 uv,
    float radius
) {

    if (
        radius <
        0.001
    ) {

        return sampleImage(uv);
    }


    vec2 r =
        vec2(
            radius /
                u_resolution.x,

            radius /
                u_resolution.y
        );


    vec4 result =
        vec4(0.0);


    /* Center */

    result +=
        sampleImage(uv)
        * 0.20;


    /* Horizontal */

    result +=
        sampleImage(
            uv +
            vec2(
                r.x,
                0.0
            )
        )
        * 0.10;

    result +=
        sampleImage(
            uv -
            vec2(
                r.x,
                0.0
            )
        )
        * 0.10;


    /* Vertical */

    result +=
        sampleImage(
            uv +
            vec2(
                0.0,
                r.y
            )
        )
        * 0.10;

    result +=
        sampleImage(
            uv -
            vec2(
                0.0,
                r.y
            )
        )
        * 0.10;


    /* Diagonal */

    result +=
        sampleImage(
            uv +
            vec2(
                r.x * .707,
                r.y * .707
            )
        )
        * 0.075;

    result +=
        sampleImage(
            uv +
            vec2(
                -r.x * .707,
                r.y * .707
            )
        )
        * 0.075;

    result +=
        sampleImage(
            uv +
            vec2(
                r.x * .707,
                -r.y * .707
            )
        )
        * 0.075;

    result +=
        sampleImage(
            uv +
            vec2(
                -r.x * .707,
                -r.y * .707
            )
        )
        * 0.075;


    return result;
}


/* =========================================================
   MAIN
   ========================================================= */

void main() {


    /* -----------------------------------------------------
       LEVEL / ZERO TILT

       This is handled FIRST.

       Therefore there is absolutely no ray calculation
       when the phone is flat.
       ----------------------------------------------------- */

    if (
        abs(u_angle) <
        0.0001
    ) {

        gl_FragColor =
            sampleImage(v_uv);

        return;
    }


    /* -----------------------------------------------------
       SCREEN COORDINATES
       ----------------------------------------------------- */

    float x =
        (v_uv.x - 0.5)
        * u_aspect;

    float y =
        v_uv.y - 0.5;


    /* -----------------------------------------------------
       HINGE
       ----------------------------------------------------- */

    float hingeX =
        u_hinge *
        u_aspect *
        0.5;


    /* -----------------------------------------------------
       DISTANCE FROM HINGE
       ----------------------------------------------------- */

    float localX =
        (x - hingeX)
        *
        (-u_hinge);


    localX =
        max(
            localX,
            0.0
        );


    /* -----------------------------------------------------
       ROTATED GLASS
       ----------------------------------------------------- */

    float c =
        cos(u_angle);

    float s =
        sin(u_angle);


    float glassX =
        hingeX
        +
        (-u_hinge)
        *
        localX
        *
        c;


    float glassZ =
        localX *
        s;


    vec3 glassPoint =
        vec3(
            glassX,
            y,
            glassZ
        );


    /* -----------------------------------------------------
       VIRTUAL EYE
       ----------------------------------------------------- */

    vec3 eye =
        vec3(
            0.0,
            0.0,
            u_eyeDistance
        );


    /* -----------------------------------------------------
       RAY
       ----------------------------------------------------- */

    vec3 ray =
        glassPoint -
        eye;


    /* -----------------------------------------------------
       RAY → ORIGINAL SCREEN PLANE

       Original screen is z = 0.
       ----------------------------------------------------- */

    float t =
        -eye.z /
        ray.z;


    vec3 hit =
        eye +
        ray * t;


    /* -----------------------------------------------------
       SOURCE IMAGE POSITION
       ----------------------------------------------------- */

    vec2 sourceUV =
        vec2(
            hit.x /
                u_aspect +
                0.5,

            hit.y +
                0.5
        );


    /* -----------------------------------------------------
       CHECK WHETHER RAY HIT THE ORIGINAL SCREEN
       ----------------------------------------------------- */

    float insideX =
        step(
            -u_aspect * 0.5,
            hit.x
        )
        *
        step(
            hit.x,
            u_aspect * 0.5
        );


    float insideY =
        step(
            -0.5,
            hit.y
        )
        *
        step(
            hit.y,
            0.5
        );


    float forward =
        step(
            0.0,
            t
        );


    float valid =
        insideX *
        insideY *
        forward;


    /* -----------------------------------------------------
       PHYSICAL GAP
       ----------------------------------------------------- */

    float gap =
        abs(glassZ);


    /* -----------------------------------------------------
       GAP → BLUR
       ----------------------------------------------------- */

    float blurRadius =
        gap *
        u_blurPerUnit;


    blurRadius =
        min(
            blurRadius,
            u_maxBlur
        );


    vec4 color =
        blurImage(
            sourceUV,
            blurRadius
        );


    /* -----------------------------------------------------
       GAP → DARKEN
       ----------------------------------------------------- */

    float darken =
        gap *
        u_darkenPerUnit;


    darken =
        min(
            darken,
            u_maxDarken
        );


    color.rgb *=
        1.0 -
        darken;


    /* -----------------------------------------------------
       BLACK WHERE RAY MISSES
       ----------------------------------------------------- */

    color.rgb *=
        smoothstep(
            0.0,
            0.10,
            valid
        );


    /* -----------------------------------------------------
       SMOOTH INTRODUCTION
       ----------------------------------------------------- */

    float effectStrength =
        smoothstep(
            radians(0.5),
            radians(3.0),
            abs(u_angle)
        );


    vec4 original =
        sampleImage(v_uv);


    color =
        mix(
            original,
            color,
            effectStrength
        );


    gl_FragColor =
        vec4(
            color.rgb,
            1.0
        );
}

`;


/* =========================================================
   CREATE SHADER
   ========================================================= */

function createShader(
    type,
    source
) {

    const shader =
        gl.createShader(type);


    gl.shaderSource(
        shader,
        source
    );


    gl.compileShader(
        shader
    );


    if (
        !gl.getShaderParameter(
            shader,
            gl.COMPILE_STATUS
        )
    ) {

        const error =
            gl.getShaderInfoLog(
                shader
            );

        showError(
            "Shader error: " +
            error
        );

        throw new Error(error);
    }


    return shader;
}


/* =========================================================
   CREATE PROGRAM
   ========================================================= */

function createProgram() {

    const vertexShader =
        createShader(
            gl.VERTEX_SHADER,
            vertexShaderSource
        );


    const fragmentShader =
        createShader(
            gl.FRAGMENT_SHADER,
            fragmentShaderSource
        );


    const program =
        gl.createProgram();


    gl.attachShader(
        program,
        vertexShader
    );


    gl.attachShader(
        program,
        fragmentShader
    );


    gl.linkProgram(
        program
    );


    if (
        !gl.getProgramParameter(
            program,
            gl.LINK_STATUS
        )
    ) {

        const error =
            gl.getProgramInfoLog(
                program
            );

        showError(
            "Program error: " +
            error
        );

        throw new Error(error);
    }


    return program;
}


let program;


try {

    program =
        createProgram();

    gl.useProgram(
        program
    );

}

catch (error) {

    console.error(error);
}


/* =========================================================
   FULLSCREEN TRIANGLE
   ========================================================= */

if (program) {

    const buffer =
        gl.createBuffer();


    gl.bindBuffer(
        gl.ARRAY_BUFFER,
        buffer
    );


    gl.bufferData(
        gl.ARRAY_BUFFER,

        new Float32Array([
            -1, -1,
             3, -1,
            -1,  3
        ]),

        gl.STATIC_DRAW
    );


    const position =
        gl.getAttribLocation(
            program,
            "a_position"
        );


    gl.enableVertexAttribArray(
        position
    );


    gl.vertexAttribPointer(
        position,
        2,
        gl.FLOAT,
        false,
        0,
        0
    );
}


/* =========================================================
   UNIFORMS
   ========================================================= */

const U = {};


if (program) {

    U.image =
        gl.getUniformLocation(
            program,
            "u_image"
        );

    U.aspect =
        gl.getUniformLocation(
            program,
            "u_aspect"
        );

    U.imageAspect =
        gl.getUniformLocation(
            program,
            "u_imageAspect"
        );

    U.angle =
        gl.getUniformLocation(
            program,
            "u_angle"
        );

    U.hinge =
        gl.getUniformLocation(
            program,
            "u_hinge"
        );

    U.eyeDistance =
        gl.getUniformLocation(
            program,
            "u_eyeDistance"
        );

    U.blurPerUnit =
        gl.getUniformLocation(
            program,
            "u_blurPerUnit"
        );

    U.maxBlur =
        gl.getUniformLocation(
            program,
            "u_maxBlur"
        );

    U.darkenPerUnit =
        gl.getUniformLocation(
            program,
            "u_darkenPerUnit"
        );

    U.maxDarken =
        gl.getUniformLocation(
            program,
            "u_maxDarken"
        );

    U.resolution =
        gl.getUniformLocation(
            program,
            "u_resolution"
        );
}


/* =========================================================
   IMAGE TEXTURE
   ========================================================= */

const texture =
    gl.createTexture();


const image =
    new Image();


image.onload =
    function() {

        gl.bindTexture(
            gl.TEXTURE_2D,
            texture
        );


        gl.pixelStorei(
            gl.UNPACK_FLIP_Y_WEBGL,
            true
        );


        gl.texImage2D(
            gl.TEXTURE_2D,
            0,
            gl.RGBA,
            gl.RGBA,
            gl.UNSIGNED_BYTE,
            image
        );


        gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_MIN_FILTER,
            gl.LINEAR
        );


        gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_MAG_FILTER,
            gl.LINEAR
        );


        gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_WRAP_S,
            gl.CLAMP_TO_EDGE
        );


        gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_WRAP_T,
            gl.CLAMP_TO_EDGE
        );


        gl.activeTexture(
            gl.TEXTURE0
        );


        gl.bindTexture(
            gl.TEXTURE_2D,
            texture
        );


        gl.uniform1i(
            U.image,
            0
        );


        gl.uniform1f(
            U.imageAspect,
            image.width /
            image.height
        );


        resize();


        requestAnimationFrame(
            render
        );
    };


image.onerror =
    function() {

        showError(
            "Could not load lockscreen.png. Make sure it is in the same folder as index.html."
        );
    };


image.src =
    "lockscreen.png";


/* =========================================================
   MOTION VARIABLES
   ========================================================= */

let rawTilt =
    0;

let targetTilt =
    0;

let currentTilt =
    0;

let zeroTilt =
    0;

let sensorReady =
    false;


/* =========================================================
   DEVICE ORIENTATION
   ========================================================= */

function handleOrientation(
    event
) {

    if (
        event.gamma === null ||
        event.gamma === undefined
    ) {

        return;
    }


    rawTilt =
        event.gamma;


    targetTilt =
        rawTilt -
        zeroTilt;


    targetTilt =
        Math.max(
            -45,
            Math.min(
                45,
                targetTilt
            )
        );


    sensorReady =
        true;
}


/* =========================================================
   CALIBRATE
   ========================================================= */

function calibrate() {

    if (!sensorReady) {

        /*
           If the sensor has not supplied a value yet,
           keep zero at 0.
        */

        zeroTilt =
            0;

        targetTilt =
            0;

        currentTilt =
            0;

        return;
    }


    zeroTilt =
        rawTilt;


    targetTilt =
        0;


    currentTilt =
        0;
}


/* =========================================================
   PERMISSION
   ========================================================= */

const permission =
    document.getElementById(
        "permission"
    );


const startButton =
    document.getElementById(
        "start"
    );


const recalibrateButton =
    document.getElementById(
        "recalibrate"
    );


startButton.addEventListener(
    "click",
    async function() {

        try {

            /*
             * iPhone requires permission.
             */

            if (
                typeof DeviceOrientationEvent !==
                "undefined" &&

                typeof DeviceOrientationEvent
                    .requestPermission ===
                "function"
            ) {

                const result =
                    await DeviceOrientationEvent
                        .requestPermission();


                if (
                    result !==
                    "granted"
                ) {

                    showError(
                        "Motion permission was denied."
                    );

                    return;
                }
            }


            /*
             * Start sensor.
             */

            window.addEventListener(
                "deviceorientation",
                handleOrientation,
                true
            );


            /*
             * Hide CTA screen immediately.
             */

            permission.style.display =
                "none";


            recalibrateButton.style.display =
                "block";


            /*
             * Wait for sensor data,
             * then establish zero position.
             */

            setTimeout(
                function() {

                    calibrate();

                },
                800
            );


        }

        catch (error) {

            showError(
                error.message ||
                String(error)
            );
        }

    }
);


/* =========================================================
   RECALIBRATE
   ========================================================= */

recalibrateButton.addEventListener(
    "click",
    function() {

        calibrate();

    }
);


/* =========================================================
   DESKTOP TEST MODE
   ========================================================= */

let dragging =
    false;


window.addEventListener(
    "pointerdown",
    function() {

        dragging =
            true;

    }
);


window.addEventListener(
    "pointerup",
    function() {

        dragging =
            false;

    }
);


window.addEventListener(
    "pointercancel",
    function() {

        dragging =
            false;

    }
);


window.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging) {
            return;
        }


        const x =
            event.clientX /
            window.innerWidth;


        targetTilt =
            (x - 0.5) *
            90;

    }
);


/* =========================================================
   RESIZE
   ========================================================= */

function resize() {

    if (!program) {
        return;
    }


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        Math.round(
            window.innerWidth *
            dpr
        );


    canvas.height =
        Math.round(
            window.innerHeight *
            dpr
        );


    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );


    gl.uniform1f(
        U.aspect,
        window.innerWidth /
        window.innerHeight
    );


    gl.uniform2f(
        U.resolution,
        canvas.width,
        canvas.height
    );
}


window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   RENDER
   ========================================================= */

function render() {

    if (!program) {
        return;
    }


    /*
       Smooth sensor movement.
    */

    currentTilt +=
        (
            targetTilt -
            currentTilt
        ) * 0.09;


    /*
       Degrees → radians.
    */

    const angle =
        currentTilt *
        Math.PI /
        180;


    /*
       Right tilt:
           LEFT hinge

       Left tilt:
           RIGHT hinge
    */

    const hinge =
        currentTilt >= 0
            ? -1
            : 1;


    /*
       Apply uniforms.
    */

    gl.uniform1f(
        U.angle,
        angle
    );


    gl.uniform1f(
        U.hinge,
        hinge
    );


    /*
       Reference-style tuning.
    */

    gl.uniform1f(
        U.eyeDistance,
        2.8
    );


    gl.uniform1f(
        U.blurPerUnit,
        0.55
    );


    gl.uniform1f(
        U.maxBlur,
        24.0
    );


    gl.uniform1f(
        U.darkenPerUnit,
        0.012
    );


    gl.uniform1f(
        U.maxDarken,
        0.55
    );


    /*
       Render.
    */

    gl.drawArrays(
        gl.TRIANGLES,
        0,
        3
    );


    requestAnimationFrame(
        render
    );
}


/* =========================================================
   GLOBAL ERROR CATCH
   ========================================================= */

window.addEventListener(
    "error",
    function(event) {

        if (
            event.message &&
            event.message !==
            "Script error."
        ) {

            showError(
                event.message
            );
        }

    }
);

</script>

</body>
</html>
