<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Tilt</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #orb {
      position: absolute;

      width: 240px;
      height: 240px;

      left: 50%;
      top: 50%;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          #ffffff 0%,
          #d9faff 7%,
          #8ee7ff 18%,
          #168cff 42%,
          #0047ff 63%,
          rgba(0, 71, 255, 0) 80%
        );

      filter: blur(16px);

      transform:
        translate(-50%, -50%)
        scale(1);

      will-change: transform, border-radius;
    }

    #motionButton {
      position: fixed;
      z-index: 10;

      top: 30px;
      left: 50%;

      transform: translateX(-50%);

      padding: 12px 20px;

      border: none;
      border-radius: 30px;

      background: white;
      color: black;

      font-size: 16px;
    }
  </style>
</head>

<body>

  <button id="motionButton">Enable Motion</button>

  <div id="orb"></div>


  <script>

    const orb = document.getElementById("orb");
    const button = document.getElementById("motionButton");


    let targetX = 0;
    let currentX = 0;

    let targetY = 0;
    let currentY = 0;

    let targetStretch = 1;
    let currentStretch = 1;

    let targetSquash = 1;
    let currentSquash = 1;

    let targetRotate = 0;
    let currentRotate = 0;

    let targetSkew = 0;
    let currentSkew = 0;


    button.addEventListener("click", async () => {

      if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
      ) {

        try {

          const permission =
            await DeviceOrientationEvent.requestPermission();

          if (permission === "granted") {

            startMotion();

            button.textContent = "Motion Enabled";

          } else {

            button.textContent = "Permission Denied";

          }

        } catch (error) {

          console.error(error);

          button.textContent = "Motion Error";

        }

      } else {

        startMotion();

        button.textContent = "Motion Enabled";

      }

    });


    function startMotion() {

      window.addEventListener(
        "deviceorientation",
        (event) => {

          /*
            LEFT / RIGHT
          */

          const gamma = event.gamma || 0;

          const horizontal =
            Math.max(
              -1,
              Math.min(1, gamma / 30)
            );


          /*
            FORWARD / BACKWARD
          */

          const beta = event.beta || 0;

          const vertical =
            Math.max(
              -1,
              Math.min(1, (beta - 45) / 30)
            );


          /*
            Position
          */

          targetX = horizontal * 230;

          targetY = vertical * 80;


          /*
            Fluid intensity
          */

          const intensity =
            Math.max(
              Math.abs(horizontal),
              Math.abs(vertical)
            );


          /*
            Stretch toward movement
          */

          targetStretch =
            1 + intensity * 0.65;


          /*
            Compress perpendicular axis
          */

          targetSquash =
            1 - intensity * 0.25;


          /*
            Small rotation
          */

          targetRotate =
            horizontal * 14;


          /*
            Slight skew creates
            a more organic pull
          */

          targetSkew =
            horizontal * 8;

        }
      );


      animate();

    }


    function animate() {

      /*
        Smooth elastic interpolation
      */

      currentX +=
        (targetX - currentX) * 0.07;

      currentY +=
        (targetY - currentY) * 0.07;

      currentStretch +=
        (targetStretch - currentStretch) * 0.07;

      currentSquash +=
        (targetSquash - currentSquash) * 0.07;

      currentRotate +=
        (targetRotate - currentRotate) * 0.07;

      currentSkew +=
        (targetSkew - currentSkew) * 0.07;


      /*
        Organic blob shape
      */

      const leftRight =
        50 - currentSkew;

      const rightLeft =
        50 + currentSkew;


      orb.style.borderRadius = `
        ${leftRight}% ${rightLeft}%
        ${rightLeft}% ${leftRight}%
        /
        ${50 - currentSkew / 2}%
        ${50 + currentSkew / 2}%
        ${50 + currentSkew / 2}%
        ${50 - currentSkew / 2}%
      `;


      /*
        Apply movement + deformation
      */

      orb.style.transform = `
        translate(
          calc(-50% + ${currentX}px),
          calc(-50% + ${currentY}px)
        )
        scaleX(${currentStretch})
        scaleY(${currentSquash})
        rotate(${currentRotate}deg)
      `;


      requestAnimationFrame(animate);

    }

  </script>

</body>
</html>
