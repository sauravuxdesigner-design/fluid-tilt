<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">

<title>Duo Effect</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
}

body {
    position: fixed;
    inset: 0;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

#permission {
    position: fixed;
    inset: 0;
    z-index: 20;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: #000;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        sans-serif;

    text-align: center;
}

#permission h1 {
    font-size: 28px;
    margin: 0 0 12px;
}

#permission p {
    max-width: 290px;
    margin: 0 0 25px;

    font-size: 15px;
    line-height: 1.5;

    opacity: .6;
}

#start {
    border: 0;
    border-radius: 100px;

    padding: 14px 25px;

    background: #fff;
    color: #000;

    font-size: 16px;
    font-weight: 600;
}

#recalibrate {
    position: fixed;
    z-index: 10;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    padding: 9px 15px;

    border: 0;
    border-radius: 100px;

    background: rgba(0,0,0,.45);
    color: rgba(255,255,255,.8);

    backdrop-filter: blur(10px);

    font-size: 12px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;

    display: none;
}
</style>
</head>

<body>

<div id="permission">

    <h1>Duo Effect</h1>

    <p>
        Hold your iPhone naturally and tap below.
        Then tilt the phone left and right.
    </p>

    <button id="start">
        Enable Motion
    </button>

</div>

<canvas id="canvas"></canvas>

<button id="recalibrate">
    Recalibrate
</button>


<script>

/* =========================================================
   WEBGL
   ========================================================= */

const canvas =
    document.getElementById("canvas");

const gl =
    canvas.getContext("webgl", {
        alpha: false,
        antialias: false,
        premultipliedAlpha: false
    });

if (!gl) {
    alert("WebGL is not supported.");
}


/* =========================================================
   VERTEX SHADER
   ========================================================= */

const vertexSource = `

attribute vec2 position;

varying vec2 uv;

void main() {

    uv = position * 0.5 + 0.5;

    gl_Position =
        vec4(position, 0.0, 1.0);
}

`;


/* =========================================================
   FRAGMENT SHADER
   ========================================================= */

const fragmentSource = `

precision highp float;

varying vec2 uv;

uniform sampler2D image;

uniform float aspect;
uniform float imageAspect;

uniform float foldAngle;
uniform float hingeSide;

uniform float eyeDistance;

uniform float blurPerUnit;
uniform float maxBlur;

uniform float darkenPerUnit;
uniform float maxDarken;


/* ---------------------------------------------------------
   IMAGE COVER
   --------------------------------------------------------- */

vec2 imageUV(vec2 p) {

    float screenAspect = aspect;

    vec2 scale = vec2(1.0);

    if (screenAspect > imageAspect) {

        scale.y =
            imageAspect /
            screenAspect;

    } else {

        scale.x =
            screenAspect /
            imageAspect;
    }

    return
        (p - 0.5) *
        scale +
        0.5;
}


/* ---------------------------------------------------------
   RAW IMAGE
   --------------------------------------------------------- */

vec4 getImage(vec2 p) {

    vec2 q =
        imageUV(p);

    if (
        q.x < 0.0 ||
        q.x > 1.0 ||
        q.y < 0.0 ||
        q.y > 1.0
    ) {
        return vec4(0.0);
    }

    return texture2D(
        image,
        q
    );
}


/* ---------------------------------------------------------
   DISK BLUR

   Samples are distributed around the actual warped
   coordinate.

   This is NOT a rectangular overlay.
   --------------------------------------------------------- */

vec4 diskBlur(
    vec2 p,
    float radius
) {

    if (radius <= 0.0001) {
        return getImage(p);
    }

    vec4 result =
        vec4(0.0);

    float r = radius;

    result +=
        getImage(
            p + vec2(
                -r,
                0.0
            )
        ) * 0.12;

    result +=
        getImage(
            p + vec2(
                r,
                0.0
            )
        ) * 0.12;

    result +=
        getImage(
            p + vec2(
                0.0,
                -r
            )
        ) * 0.12;

    result +=
        getImage(
            p + vec2(
                0.0,
                r
            )
        ) * 0.12;


    result +=
        getImage(
            p + vec2(
                -r * .707,
                -r * .707
            )
        ) * 0.08;

    result +=
        getImage(
            p + vec2(
                r * .707,
                -r * .707
            )
        ) * 0.08;

    result +=
        getImage(
            p + vec2(
                -r * .707,
                r * .707
            )
        ) * 0.08;

    result +=
        getImage(
            p + vec2(
                r * .707,
                r * .707
            )
        ) * 0.08;


    result +=
        getImage(
            p + vec2(
                -r * .35,
                0.0
            )
        ) * 0.05;

    result +=
        getImage(
            p + vec2(
                r * .35,
                0.0
            )
        ) * 0.05;

    result +=
        getImage(
            p + vec2(
                0.0,
                -r * .35
            )
        ) * 0.05;

    result +=
        getImage(
            p + vec2(
                0.0,
                r * .35
            )
        ) * 0.05;


    return result;
}


/* =========================================================
   MAIN
   ========================================================= */

void main() {

    /*
       -----------------------------------------------------
       SCREEN COORDINATES

       x = physical horizontal position
       y = vertical position
       -----------------------------------------------------
    */

    float x =
        (uv.x - 0.5) *
        aspect;

    float y =
        uv.y - 0.5;


    /*
       -----------------------------------------------------
       HINGE

       +1 = right hinge
       -1 = left hinge
       -----------------------------------------------------
    */

    float hingeX =
        hingeSide *
        aspect *
        0.5;


    /*
       Distance from hinge.

       This is important because the deformation
       progressively increases away from the hinge.
    */

    float localX =
        (x - hingeX) *
        (-hingeSide);


    /*
       Clamp tiny numerical errors.
    */

    localX =
        max(
            localX,
            0.0
        );


    /*
       -----------------------------------------------------
       ROTATED GLASS PLANE
       -----------------------------------------------------

       The original screen stays completely flat.

       Only the virtual glass rotates.
    */

    float c =
        cos(foldAngle);

    float s =
        sin(foldAngle);


    float glassX =
        hingeX +
        (-hingeSide) *
        localX *
        c;


    float glassZ =
        localX *
        s;


    /*
       Physical point on glass.
    */

    vec3 glass =
        vec3(
            glassX,
            y,
            glassZ
        );


    /*
       -----------------------------------------------------
       STATIONARY EYE

       The reference uses a stationary eye on the
       normal of the interface plane.

       ~320mm in the original implementation.
    */

    vec3 eye =
        vec3(
            0.0,
            0.0,
            eyeDistance
        );


    /*
       -----------------------------------------------------
       RAY
       -----------------------------------------------------
    */

    vec3 ray =
        glass -
        eye;


    /*
       -----------------------------------------------------
       INTERSECTION WITH ORIGINAL SCREEN

       Original interface plane:
           z = 0
    */

    float t =
        -eye.z /
        ray.z;


    vec3 hit =
        eye +
        ray * t;


    /*
       -----------------------------------------------------
       CONVERT HIT → IMAGE UV
       -----------------------------------------------------
    */

    vec2 source =
        vec2(
            hit.x / aspect + 0.5,
            hit.y + 0.5
        );


    /*
       -----------------------------------------------------
       VALIDITY
       -----------------------------------------------------
    */

    float validX =
        step(
            -aspect * 0.5,
            hit.x
        ) *
        step(
            hit.x,
            aspect * 0.5
        );

    float validY =
        step(
            -0.5,
            hit.y
        ) *
        step(
            hit.y,
            0.5
        );

    float validT =
        step(
            0.0,
            t
        );


    float valid =
        validX *
        validY *
        validT;


    /*
       -----------------------------------------------------
       GAP

       This is the actual distance between the virtual
       glass and the original screen.

       The reference implementation derives blur from
       this gap.
    */

    float gap =
        abs(glassZ);


    /*
       -----------------------------------------------------
       BLUR

       Convert physical-ish gap into blur radius.
    */

    float blur =
        gap *
        blurPerUnit;

    blur =
        min(
            blur,
            maxBlur
        );


    /*
       UV blur radius.

       Scale based on screen dimensions.
    */

    float blurUV =
        blur /
        max(
            canvasSize.x,
            canvasSize.y
        );


    /*
       -----------------------------------------------------
       IMAGE
       -----------------------------------------------------
    */

    vec4 color =
        diskBlur(
            source,
            blurUV
        );


    /*
       -----------------------------------------------------
       DARKEN

       More gap = darker folded region.
    */

    float darken =
        gap *
        darkenPerUnit;

    darken =
        min(
            darken,
            maxDarken
        );

    color.rgb *=
        1.0 -
        darken;


    /*
       -----------------------------------------------------
       SOFT MISS

       Rather than making a hard rectangular cutoff,
       fade the failed rays naturally.
    */

    float missFade =
        smoothstep(
            0.0,
            0.08,
            valid
        );

    color.rgb *=
        missFade;


    /*
       -----------------------------------------------------
       ZERO TILT

       At 0° we want the exact original image.
    */

    float foldStrength =
        smoothstep(
            radians(0.3),
            radians(2.0),
            abs(foldAngle)
        );


    vec4 original =
        getImage(uv);


    color =
        mix(
            original,
            color,
            foldStrength
        );


    gl_FragColor =
        vec4(
            color.rgb,
            1.0
        );
}

`;


/* =========================================================
   IMPORTANT:
   canvasSize is added to the shader dynamically because
   the blur radius needs the real pixel dimensions.
   ========================================================= */

const finalFragmentSource =
    fragmentSource.replace(
        "uniform float darkenPerUnit;",
        "uniform vec2 canvasSize;\\nuniform float darkenPerUnit;"
    );


/* =========================================================
   SHADER COMPILATION
   ========================================================= */

function shader(
    type,
    source
) {

    const s =
        gl.createShader(type);

    gl.shaderSource(
        s,
        source
    );

    gl.compileShader(s);

    if (
        !gl.getShaderParameter(
            s,
            gl.COMPILE_STATUS
        )
    ) {

        console.error(
            gl.getShaderInfoLog(s)
        );

        throw new Error(
            gl.getShaderInfoLog(s)
        );
    }

    return s;
}


const vs =
    shader(
        gl.VERTEX_SHADER,
        vertexSource
    );

const fs =
    shader(
        gl.FRAGMENT_SHADER,
        finalFragmentSource
    );


const program =
    gl.createProgram();

gl.attachShader(
    program,
    vs
);

gl.attachShader(
    program,
    fs
);

gl.linkProgram(
    program
);

if (
    !gl.getProgramParameter(
        program,
        gl.LINK_STATUS
    )
) {

    throw new Error(
        gl.getProgramInfoLog(program)
    );
}

gl.useProgram(
    program
);


/* =========================================================
   FULLSCREEN TRIANGLE
   ========================================================= */

const buffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ARRAY_BUFFER,
    buffer
);

gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array([
        -1, -1,
         3, -1,
        -1,  3
    ]),
    gl.STATIC_DRAW
);


const position =
    gl.getAttribLocation(
        program,
        "position"
    );

gl.enableVertexAttribArray(
    position
);

gl.vertexAttribPointer(
    position,
    2,
    gl.FLOAT,
    false,
    0,
    0
);


/* =========================================================
   UNIFORMS
   ========================================================= */

const U = {

    image:
        gl.getUniformLocation(
            program,
            "image"
        ),

    aspect:
        gl.getUniformLocation(
            program,
            "aspect"
        ),

    imageAspect:
        gl.getUniformLocation(
            program,
            "imageAspect"
        ),

    foldAngle:
        gl.getUniformLocation(
            program,
            "foldAngle"
        ),

    hingeSide:
        gl.getUniformLocation(
            program,
            "hingeSide"
        ),

    eyeDistance:
        gl.getUniformLocation(
            program,
            "eyeDistance"
        ),

    blurPerUnit:
        gl.getUniformLocation(
            program,
            "blurPerUnit"
        ),

    maxBlur:
        gl.getUniformLocation(
            program,
            "maxBlur"
        ),

    darkenPerUnit:
        gl.getUniformLocation(
            program,
            "darkenPerUnit"
        ),

    maxDarken:
        gl.getUniformLocation(
            program,
            "maxDarken"
        ),

    canvasSize:
        gl.getUniformLocation(
            program,
            "canvasSize"
        )
};


/* =========================================================
   IMAGE TEXTURE
   ========================================================= */

const texture =
    gl.createTexture();

const img =
    new Image();

img.src =
    "lockscreen.png";

img.onload = () => {

    gl.bindTexture(
        gl.TEXTURE_2D,
        texture
    );

    gl.pixelStorei(
        gl.UNPACK_FLIP_Y_WEBGL,
        true
    );

    gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        img
    );

    gl.texParameteri(
        gl.TEXTURE_2D,
        gl.TEXTURE_MIN_FILTER,
        gl.LINEAR
    );

    gl.texParameteri(
        gl.TEXTURE_2D,
        gl.TEXTURE_MAG_FILTER,
        gl.LINEAR
    );

    gl.texParameteri(
        gl.TEXTURE_2D,
        gl.TEXTURE_WRAP_S,
        gl.CLAMP_TO_EDGE
    );

    gl.texParameteri(
        gl.TEXTURE_2D,
        gl.TEXTURE_WRAP_T,
        gl.CLAMP_TO_EDGE
    );

    gl.activeTexture(
        gl.TEXTURE0
    );

    gl.bindTexture(
        gl.TEXTURE_2D,
        texture
    );

    gl.uniform1i(
        U.image,
        0
    );

    gl.uniform1f(
        U.imageAspect,
        img.width /
        img.height
    );

    resize();

    requestAnimationFrame(
        render
    );
};


/* =========================================================
   MOTION STATE
   ========================================================= */

let rawTilt = 0;
let calibratedTilt = 0;

let currentTilt = 0;

let zeroTilt = 0;

let hasMotion = false;


/* =========================================================
   SENSOR
   ========================================================= */

function orientation(
    event
) {

    if (
        event.gamma === null ||
        event.gamma === undefined
    ) {
        return;
    }

    rawTilt =
        event.gamma;

    calibratedTilt =
        rawTilt -
        zeroTilt;

    calibratedTilt =
        Math.max(
            -45,
            Math.min(
                45,
                calibratedTilt
            )
        );

    hasMotion = true;
}


/* =========================================================
   CALIBRATE
   ========================================================= */

function calibrate() {

    zeroTilt =
        rawTilt;

    calibratedTilt =
        0;

    currentTilt =
        0;
}


/* =========================================================
   MOTION PERMISSION
   ========================================================= */

const permission =
    document.getElementById(
        "permission"
    );

const start =
    document.getElementById(
        "start"
    );

const recalibrate =
    document.getElementById(
        "recalibrate"
    );


start.addEventListener(
    "click",
    async () => {

        try {

            if (
                typeof DeviceOrientationEvent !==
                "undefined" &&
                typeof DeviceOrientationEvent
                    .requestPermission ===
                "function"
            ) {

                const result =
                    await DeviceOrientationEvent
                        .requestPermission();

                if (
                    result !==
                    "granted"
                ) {

                    alert(
                        "Motion permission was not granted."
                    );

                    return;
                }
            }

            window.addEventListener(
                "deviceorientation",
                orientation,
                true
            );

            permission.style.display =
                "none";

            recalibrate.style.display =
                "block";

            /*
               Give sensor a moment to provide
               the first value, then calibrate.
            */

            setTimeout(
                calibrate,
                400
            );

        } catch (error) {

            console.error(error);

            alert(
                "Unable to enable motion."
            );
        }
    }
);


recalibrate.addEventListener(
    "click",
    calibrate
);


/* =========================================================
   DESKTOP TEST

   Drag left/right with mouse.
   ========================================================= */

let dragging = false;

window.addEventListener(
    "pointerdown",
    () => {
        dragging = true;
    }
);

window.addEventListener(
    "pointerup",
    () => {
        dragging = false;
    }
);

window.addEventListener(
    "pointermove",
    event => {

        if (!dragging) {
            return;
        }

        const x =
            event.clientX /
            window.innerWidth;

        calibratedTilt =
            (x - 0.5) *
            90;
    }
);


/* =========================================================
   RESIZE
   ========================================================= */

function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        window.innerWidth *
        dpr;

    canvas.height =
        window.innerHeight *
        dpr;

    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );

    gl.uniform2f(
        U.canvasSize,
        canvas.width,
        canvas.height
    );

    gl.uniform1f(
        U.aspect,
        window.innerWidth /
        window.innerHeight
    );
}


window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   RENDER
   ========================================================= */

function render() {

    /*
       Smooth sensor response.
    */

    currentTilt +=
        (
            calibratedTilt -
            currentTilt
        ) * 0.085;


    /*
       Degrees → radians.
    */

    const radians =
        currentTilt *
        Math.PI /
        180;


    /*
       Determine hinge.

       Positive tilt:
           LEFT hinge

       Negative tilt:
           RIGHT hinge
    */

    const hinge =
        currentTilt >= 0
            ? -1
            : 1;


    gl.uniform1f(
        U.foldAngle,
        radians
    );

    gl.uniform1f(
        U.hingeSide,
        hinge
    );


    /*
       Same basic physical values as the reference
       implementation, translated to our normalized
       WebGL coordinate system.
    */

    gl.uniform1f(
        U.eyeDistance,
        2.8
    );


    /*
       Gap → blur.
    */

    gl.uniform1f(
        U.blurPerUnit,
        0.55
    );

    gl.uniform1f(
        U.maxBlur,
        24.0
    );


    /*
       Gap → darkening.
    */

    gl.uniform1f(
        U.darkenPerUnit,
        0.012
    );

    gl.uniform1f(
        U.maxDarken,
        0.55
    );


    gl.drawArrays(
        gl.TRIANGLES,
        0,
        3
    );


    requestAnimationFrame(
        render
    );
}

</script>

</body>
</html>
