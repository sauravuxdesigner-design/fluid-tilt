<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Duo Fold Animation</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050505;
        font-family: Inter, Arial, sans-serif;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .stage {
        width: min(92vw, 430px);
        height: min(88vh, 820px);
        position: relative;
        perspective: 1200px;
    }

    /*
     * Main screen
     */
    .phone {
        position: absolute;
        inset: 0;

        overflow: hidden;

        background:
            linear-gradient(
                145deg,
                #181818 0%,
                #0d0d0d 50%,
                #080808 100%
            );

        border: 1px solid rgba(255,255,255,.1);

        border-radius: 32px;

        box-shadow:
            0 40px 100px rgba(0,0,0,.65),
            inset 0 0 0 1px rgba(255,255,255,.04);
    }

    /*
     * Content plane
     */
    .content {
        position: absolute;
        inset: 0;

        padding: 28px;

        color: white;

        transform-origin: center;
    }

    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;

        margin-bottom: 45px;
    }

    .logo {
        width: 38px;
        height: 38px;

        border-radius: 12px;

        background:
            linear-gradient(
                135deg,
                #ffffff,
                #777
            );

        box-shadow:
            0 8px 30px rgba(255,255,255,.1);
    }

    .menu {
        width: 38px;
        height: 38px;

        border-radius: 50%;

        border: 1px solid rgba(255,255,255,.15);

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 15px;
    }

    .hero {
        margin-top: 40px;
    }

    .eyebrow {
        font-size: 11px;
        letter-spacing: .2em;

        color: rgba(255,255,255,.4);

        text-transform: uppercase;

        margin-bottom: 16px;
    }

    h1 {
        font-size: clamp(48px, 12vw, 82px);
        line-height: .88;
        letter-spacing: -.06em;

        font-weight: 700;
    }

    h1 span {
        color: rgba(255,255,255,.25);
    }

    .description {
        max-width: 280px;

        margin-top: 28px;

        color: rgba(255,255,255,.5);

        font-size: 14px;
        line-height: 1.6;
    }

    /*
     * Card
     */
    .card {
        position: absolute;

        left: 28px;
        right: 28px;
        bottom: 28px;

        height: 230px;

        border-radius: 25px;

        padding: 24px;

        background:
            linear-gradient(
                145deg,
                rgba(255,255,255,.12),
                rgba(255,255,255,.025)
            );

        border: 1px solid rgba(255,255,255,.1);

        backdrop-filter: blur(20px);
    }

    .card-label {
        font-size: 11px;

        color: rgba(255,255,255,.4);

        letter-spacing: .15em;
        text-transform: uppercase;
    }

    .card h2 {
        position: absolute;

        bottom: 22px;
        left: 24px;

        font-size: 32px;
        letter-spacing: -.04em;
    }

    /*
     * Fold layer
     *
     * This is the visual glass surface.
     */
    .fold {
        position: absolute;

        inset: 0;

        pointer-events: none;

        transform-style: preserve-3d;

        overflow: hidden;

        border-radius: inherit;

        opacity: 0;

        background:
            linear-gradient(
                90deg,
                rgba(255,255,255,.08),
                rgba(255,255,255,.015)
            );

        mix-blend-mode: screen;

        filter:
            blur(0px)
            brightness(1);
    }

    /*
     * Hinge highlight
     */
    .hinge {
        position: absolute;

        top: 0;
        bottom: 0;

        width: 2px;

        left: 50%;

        transform:
            translateX(-50%);

        background:
            linear-gradient(
                transparent,
                rgba(255,255,255,.5),
                transparent
            );

        opacity: .3;

        pointer-events: none;
    }

    /*
     * Controls
     */
    .controls {
        position: fixed;

        bottom: 25px;
        left: 50%;

        transform: translateX(-50%);

        width: min(420px, 90vw);

        display: flex;
        align-items: center;
        gap: 12px;

        padding: 12px 16px;

        border-radius: 999px;

        background: rgba(20,20,20,.75);

        border: 1px solid rgba(255,255,255,.1);

        backdrop-filter: blur(20px);
    }

    .controls span {
        min-width: 50px;

        color: rgba(255,255,255,.55);

        font-size: 12px;
        text-align: center;
    }

    input[type="range"] {
        width: 100%;

        accent-color: white;

        cursor: pointer;
    }

    .hint {
        position: fixed;

        top: 25px;
        left: 50%;

        transform: translateX(-50%);

        color: rgba(255,255,255,.35);

        font-size: 11px;

        letter-spacing: .05em;
    }

    @media (max-width: 600px) {

        .stage {
            width: 90vw;
            height: 82vh;
        }

        .phone {
            border-radius: 26px;
        }

        .content {
            padding: 24px;
        }

        .card {
            left: 24px;
            right: 24px;
            bottom: 24px;
        }
    }
</style>
</head>

<body>

<div class="hint">
    DRAG OR USE THE SLIDER
</div>

<div class="stage">

    <div class="phone" id="phone">

        <div class="content" id="content">

            <div class="topbar">
                <div class="logo"></div>

                <div class="menu">
                    •••
                </div>
            </div>

            <div class="hero">

                <div class="eyebrow">
                    Duo Fold
                </div>

                <h1>
                    Fold<br>
                    <span>the screen.</span>
                </h1>

                <p class="description">
                    A browser recreation of the DuoFold
                    perspective and frosted-glass effect.
                </p>

            </div>

            <div class="card">

                <div class="card-label">
                    Interactive surface
                </div>

                <h2>
                    Explore
                </h2>

            </div>

        </div>

        <div class="fold" id="fold"></div>

        <div class="hinge" id="hinge"></div>

    </div>

</div>


<div class="controls">

    <span id="angleText">
        0°
    </span>

    <input
        id="slider"
        type="range"
        min="-45"
        max="45"
        step="0.1"
        value="0"
    >

</div>


<script>

const phone = document.getElementById("phone");
const content = document.getElementById("content");
const fold = document.getElementById("fold");
const hinge = document.getElementById("hinge");

const slider = document.getElementById("slider");
const angleText = document.getElementById("angleText");

let tilt = 0;

let dragging = false;
let startX = 0;
let startTilt = 0;


/*
|--------------------------------------------------------------------------
| DuoFold parameters
|--------------------------------------------------------------------------
|
| These correspond conceptually to the values in the original project:
|
| eyeDistance
| blurSpread
| darkening
|
*/

const PARAMETERS = {

    eyeDistance: 320,

    blurSpread: 0.55,

    darkening: 0.012,

    maxBlur: 24,

    maxDarken: 0.55

};


/*
|--------------------------------------------------------------------------
| Clamp
|--------------------------------------------------------------------------
*/

function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );

}


/*
|--------------------------------------------------------------------------
| Update fold
|--------------------------------------------------------------------------
*/

function updateFold(value) {

    tilt = clamp(
        parseFloat(value),
        -45,
        45
    );

    slider.value = tilt;

    angleText.textContent =
        `${tilt > 0 ? "+" : ""}${tilt.toFixed(1)}°`;


    /*
     * No tilt
     */
    if (Math.abs(tilt) < 0.01) {

        fold.style.opacity = "0";

        fold.style.filter =
            "blur(0px) brightness(1)";

        hinge.style.opacity = ".25";

        return;
    }


    /*
     * Fold direction.
     *
     * Positive:
     * hinge on right.
     *
     * Negative:
     * hinge on left.
     */

    const positive = tilt > 0;

    const angle = Math.abs(tilt);

    const radians =
        angle * Math.PI / 180;


    /*
     * Physical distance from hinge.
     */

    const width =
        phone.getBoundingClientRect().width;

    const gap =
        width * Math.sin(radians);


    /*
     * Blur radius.
     */

    const blurRadius =
        clamp(
            PARAMETERS.blurSpread * gap / 10,
            0,
            PARAMETERS.maxBlur
        );


    /*
     * Darkening.
     */

    const darkening =
        clamp(
            PARAMETERS.darkening *
            blurRadius,
            0,
            PARAMETERS.maxDarken
        );


    /*
     * Fold strength.
     */

    const strength =
        clamp(
            angle / 45,
            0,
            1
        );


    /*
     * Browser-side approximation of the
     * shader's glass/frost effect.
     */

    fold.style.opacity =
        (0.12 + strength * 0.42)
        .toFixed(3);


    fold.style.filter =
        `
        blur(${blurRadius.toFixed(2)}px)
        brightness(${(1 - darkening).toFixed(3)})
        `;


    /*
     * Perspective transform.
     */

    const rotateY =
        positive
            ? -angle
            : angle;


    /*
     * The original shader rotates the glass
     * around the edge farther from the viewer.
     */

    content.style.transform =
        `
        perspective(1200px)
        rotateY(${rotateY}deg)
        scaleX(${1 - strength * .035})
        `;


    /*
     * Position the hinge.
     */

    hinge.style.left =
        positive ? "100%" : "0%";

    hinge.style.opacity =
        (.25 + strength * .65)
        .toFixed(3);


    /*
     * Create a directional frost gradient.
     */

    if (positive) {

        fold.style.background =
            `
            linear-gradient(
                90deg,
                rgba(255,255,255,${0.18 * strength}),
                rgba(255,255,255,0.015)
            )
            `;

    } else {

        fold.style.background =
            `
            linear-gradient(
                90deg,
                rgba(255,255,255,0.015),
                rgba(255,255,255,${0.18 * strength})
            )
            `;

    }

}


/*
|--------------------------------------------------------------------------
| Slider
|--------------------------------------------------------------------------
*/

slider.addEventListener(
    "input",
    e => {

        updateFold(e.target.value);

    }
);


/*
|--------------------------------------------------------------------------
| Mouse interaction
|--------------------------------------------------------------------------
*/

phone.addEventListener(
    "pointerdown",
    e => {

        dragging = true;

        startX = e.clientX;

        startTilt = tilt;

        phone.setPointerCapture(e.pointerId);

    }
);


phone.addEventListener(
    "pointermove",
    e => {

        if (!dragging)
            return;


        const delta =
            e.clientX - startX;


        /*
         * Sensitivity.
         */

        const next =
            startTilt + delta * 0.18;


        updateFold(next);

    }
);


phone.addEventListener(
    "pointerup",
    () => {

        dragging = false;

    }
);


phone.addEventListener(
    "pointercancel",
    () => {

        dragging = false;

    }
);


/*
|--------------------------------------------------------------------------
| Touch / device orientation
|--------------------------------------------------------------------------
|
| If available, use the device's tilt.
|
*/

let orientationEnabled = false;

function handleOrientation(event) {

    if (!orientationEnabled)
        return;


    if (event.gamma == null)
        return;


    const value =
        clamp(event.gamma, -45, 45);

    updateFold(value);

}


window.addEventListener(
    "deviceorientation",
    handleOrientation
);


/*
|--------------------------------------------------------------------------
| Enable motion
|--------------------------------------------------------------------------
*/

async function enableOrientation() {

    /*
     * iOS requires explicit permission.
     */

    if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
    ) {

        try {

            const permission =
                await DeviceOrientationEvent.requestPermission();

            if (permission === "granted") {

                orientationEnabled = true;

            }

        } catch (error) {

            console.log(
                "Orientation permission denied."
            );

        }

    } else {

        orientationEnabled = true;

    }

}


/*
|--------------------------------------------------------------------------
| Double click = sensor mode
|--------------------------------------------------------------------------
*/

phone.addEventListener(
    "dblclick",
    enableOrientation
);


/*
|--------------------------------------------------------------------------
| Keyboard
|--------------------------------------------------------------------------
*/

window.addEventListener(
    "keydown",
    e => {

        if (e.key === "ArrowLeft") {

            updateFold(
                tilt - 2
            );

        }

        if (e.key === "ArrowRight") {

            updateFold(
                tilt + 2
            );

        }

        if (e.key === "Escape") {

            updateFold(0);

        }

    }
);


/*
|--------------------------------------------------------------------------
| Initial state
|--------------------------------------------------------------------------
*/

updateFold(0);

</script>

</body>
</html>
