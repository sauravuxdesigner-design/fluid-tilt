<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">

<title>Duo Lock Screen</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
}

body {
    position: fixed;
    inset: 0;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

/* Permission screen */

#permission {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 30px;

    background: #000;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        sans-serif;

    text-align: center;
}

#permission h1 {
    margin: 0 0 12px;
    font-size: 28px;
    font-weight: 600;
}

#permission p {
    max-width: 300px;
    margin: 0 0 28px;

    font-size: 15px;
    line-height: 1.5;

    opacity: .6;
}

#start {
    border: 0;
    outline: none;

    padding: 14px 26px;

    border-radius: 999px;

    background: #fff;
    color: #000;

    font-size: 16px;
    font-weight: 600;
}

#start:active {
    transform: scale(.97);
}

#recalibrate {
    position: fixed;
    z-index: 50;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    display: none;

    border: 0;

    padding: 9px 16px;

    border-radius: 999px;

    background: rgba(0,0,0,.45);

    color: rgba(255,255,255,.85);

    backdrop-filter: blur(10px);

    font-size: 12px;
}

#error {
    position: fixed;
    z-index: 200;

    left: 20px;
    right: 20px;
    bottom: 20px;

    display: none;

    padding: 15px;

    border-radius: 12px;

    background: #400;

    color: #fff;

    font-family: monospace;
    font-size: 12px;
    line-height: 1.4;

    word-break: break-word;
}
</style>
</head>

<body>

<div id="permission">

    <h1>Duo Effect</h1>

    <p>
        Hold your iPhone normally and enable motion.
        Tilt left and right to control the fold.
    </p>

    <button id="start">
        Enable Motion
    </button>

</div>

<canvas id="canvas"></canvas>

<button id="recalibrate">
    Recalibrate
</button>

<div id="error"></div>


<script>

/* =========================================================
   ERROR HANDLING
   ========================================================= */

const errorBox =
    document.getElementById("error");

function showError(message) {

    console.error(message);

    errorBox.textContent =
        "Error: " + message;

    errorBox.style.display =
        "block";
}


/* =========================================================
   WEBGL
   ========================================================= */

const canvas =
    document.getElementById("canvas");

const gl =
    canvas.getContext("webgl", {
        alpha: false,
        antialias: false,
        premultipliedAlpha: false
    });

if (!gl) {

    showError(
        "WebGL is not supported."
    );
}


/* =========================================================
   VERTEX SHADER
   ========================================================= */

const vertexShaderSource = `

attribute vec2 a_position;

varying vec2 v_uv;

void main() {

    v_uv =
        a_position * 0.5 +
        0.5;

    gl_Position =
        vec4(
            a_position,
            0.0,
            1.0
        );
}

`;


/* =========================================================
   FRAGMENT SHADER
   ========================================================= */

const fragmentShaderSource = `

precision highp float;

varying vec2 v_uv;

uniform sampler2D u_image;

uniform float u_aspect;
uniform float u_imageAspect;

uniform vec2 u_resolution;


/*
   Fold state
*/

uniform float u_angle;
uniform float u_hinge;


/*
   Physical model
*/

uniform float u_screenWidthMm;
uniform float u_viewDistanceMm;

uniform float u_blurPerMm;
uniform float u_maxBlurPx;

uniform float u_darkenPerMm;
uniform float u_maxDarken;


/* =========================================================
   IMAGE COVER
   ========================================================= */

vec2 getImageUV(vec2 uv) {

    float screenAspect =
        u_aspect;

    float imageAspect =
        u_imageAspect;

    vec2 scale =
        vec2(1.0);

    if (
        screenAspect >
        imageAspect
    ) {

        scale.y =
            imageAspect /
            screenAspect;

    } else {

        scale.x =
            screenAspect /
            imageAspect;
    }

    return
        (uv - 0.5)
        * scale
        + 0.5;
}


/* =========================================================
   IMAGE SAMPLE
   ========================================================= */

vec4 sampleImage(vec2 uv) {

    vec2 p =
        getImageUV(uv);

    if (
        p.x < 0.0 ||
        p.x > 1.0 ||
        p.y < 0.0 ||
        p.y > 1.0
    ) {

        return vec4(0.0);
    }

    return texture2D(
        u_image,
        p
    );
}


/* =========================================================
   12-TAP DISK BLUR
   ========================================================= */

vec4 diskBlur(
    vec2 uv,
    float radiusPx
) {

    if (
        radiusPx < 0.5
    ) {

        return sampleImage(uv);
    }


    vec2 r =
        vec2(
            radiusPx /
            u_resolution.x,

            radiusPx /
            u_resolution.y
        );


    vec4 result =
        vec4(0.0);


    /* center */

    result +=
        sampleImage(uv)
        * 0.18;


    /* cardinal */

    result +=
        sampleImage(
            uv + vec2(r.x, 0.0)
        )
        * 0.09;

    result +=
        sampleImage(
            uv - vec2(r.x, 0.0)
        )
        * 0.09;

    result +=
        sampleImage(
            uv + vec2(0.0, r.y)
        )
        * 0.09;

    result +=
        sampleImage(
            uv - vec2(0.0, r.y)
        )
        * 0.09;


    /* diagonal */

    result +=
        sampleImage(
            uv +
            vec2(
                r.x * 0.707,
                r.y * 0.707
            )
        )
        * 0.07;

    result +=
        sampleImage(
            uv +
            vec2(
                -r.x * 0.707,
                r.y * 0.707
            )
        )
        * 0.07;

    result +=
        sampleImage(
            uv +
            vec2(
                r.x * 0.707,
                -r.y * 0.707
            )
        )
        * 0.07;

    result +=
        sampleImage(
            uv +
            vec2(
                -r.x * 0.707,
                -r.y * 0.707
            )
        )
        * 0.07;


    /* inner ring */

    result +=
        sampleImage(
            uv +
            vec2(
                r.x * 0.45,
                0.0
            )
        )
        * 0.045;

    result +=
        sampleImage(
            uv -
            vec2(
                r.x * 0.45,
                0.0
            )
        )
        * 0.045;

    result +=
        sampleImage(
            uv +
            vec2(
                0.0,
                r.y * 0.45
            )
        )
        * 0.045;

    result +=
        sampleImage(
            uv -
            vec2(
                0.0,
                r.y * 0.45
            )
        )
        * 0.045;


    return result;
}


/* =========================================================
   MAIN
   ========================================================= */

void main() {

    /*
       -----------------------------------------------------
       ZERO STATE
       -----------------------------------------------------
    */

    if (
        abs(u_angle) <
        0.0001
    ) {

        gl_FragColor =
            sampleImage(v_uv);

        return;
    }


    /*
       -----------------------------------------------------
       SCREEN POSITION
       -----------------------------------------------------
    */

    float x =
        (v_uv.x - 0.5)
        * u_aspect;

    float y =
        v_uv.y - 0.5;


    /*
       -----------------------------------------------------
       HINGE
       -----------------------------------------------------

       u_hinge:

       -1 = left hinge
       +1 = right hinge
    */

    float hingeX =
        u_hinge *
        u_aspect *
        0.5;


    /*
       -----------------------------------------------------
       LOCAL DISTANCE
       -----------------------------------------------------

       Always measured INTO the screen from the hinge.
    */

    float localX =
        (x - hingeX)
        *
        (-u_hinge);

    localX =
        max(
            localX,
            0.0
        );


    /*
       -----------------------------------------------------
       ROTATION
       -----------------------------------------------------

       IMPORTANT:

       Z direction is mirrored with the hinge.

       This makes left/right physically symmetric.
    */

    float angle =
        abs(u_angle);

    float c =
        cos(angle);

    float s =
        sin(angle);


    /*
       X position of glass.
    */

    float glassX =
        hingeX
        +
        (-u_hinge)
        *
        localX
        *
        c;


    /*
       Z position.

       This is the critical left/right correction.
    */

    float glassZ =
        localX *
        s *
        (-u_hinge);


    /*
       -----------------------------------------------------
       PHYSICAL GAP
       -----------------------------------------------------

       Convert normalized screen distance into mm.
    */

    float gapMm =
        abs(glassZ)
        *
        (
            u_screenWidthMm /
            u_aspect
        );


    /*
       -----------------------------------------------------
       PHYSICAL BLUR
       -----------------------------------------------------

       0.55 px/mm
       maximum 24px
    */

    float blurRadiusPx =
        gapMm *
        u_blurPerMm;

    blurRadiusPx =
        min(
            blurRadiusPx,
            u_maxBlurPx
        );


    /*
       -----------------------------------------------------
       VIRTUAL GLASS
       -----------------------------------------------------
    */

    vec3 glassPoint =
        vec3(
            glassX,
            y,
            glassZ
        );


    /*
       -----------------------------------------------------
       STATIONARY EYE
       -----------------------------------------------------
    */

    float eyeZ =
        u_viewDistanceMm
        *
        (
            u_aspect /
            u_screenWidthMm
        );


    vec3 eye =
        vec3(
            0.0,
            0.0,
            eyeZ
        );


    /*
       -----------------------------------------------------
       RAY
       -----------------------------------------------------
    */

    vec3 ray =
        glassPoint -
        eye;


    /*
       -----------------------------------------------------
       RAY → ORIGINAL SCREEN
       -----------------------------------------------------
    */

    float t =
        -eye.z /
        ray.z;


    vec3 hit =
        eye +
        ray *
        t;


    /*
       -----------------------------------------------------
       SOURCE IMAGE
       -----------------------------------------------------
    */

    vec2 sourceUV =
        vec2(
            hit.x /
            u_aspect
            +
            0.5,

            hit.y +
            0.5
        );


    /*
       -----------------------------------------------------
       VALIDITY
       -----------------------------------------------------
    */

    float insideX =
        step(
            -u_aspect * 0.5,
            hit.x
        )
        *
        step(
            hit.x,
            u_aspect * 0.5
        );


    float insideY =
        step(
            -0.5,
            hit.y
        )
        *
        step(
            hit.y,
            0.5
        );


    float forward =
        step(
            0.0,
            t
        );


    float valid =
        insideX *
        insideY *
        forward;


    /*
       -----------------------------------------------------
       BLUR THE WARPED IMAGE
       -----------------------------------------------------
    */

    vec4 foldedColor =
        diskBlur(
            sourceUV,
            blurRadiusPx
        );


    /*
       -----------------------------------------------------
       DARKEN
       -----------------------------------------------------
    */

    float darken =
        gapMm *
        u_darkenPerMm;

    darken =
        min(
            darken,
            u_maxDarken
        );

    foldedColor.rgb *=
        1.0 -
        darken;


    /*
       -----------------------------------------------------
       MISSED RAY
       -----------------------------------------------------
    */

    float missFade =
        smoothstep(
            0.0,
            0.08,
            valid
        );

    foldedColor.rgb *=
        missFade;


    /*
       -----------------------------------------------------
       EFFECT STRENGTH
       -----------------------------------------------------
    */

    float strength =
        smoothstep(
            radians(0.5),
            radians(3.0),
            abs(u_angle)
        );


    vec4 original =
        sampleImage(v_uv);


    vec4 result =
        mix(
            original,
            foldedColor,
            strength
        );


    gl_FragColor =
        vec4(
            result.rgb,
            1.0
        );
}

`;


/* =========================================================
   SHADER CREATION
   ========================================================= */

function createShader(
    type,
    source
) {

    const shader =
        gl.createShader(type);

    gl.shaderSource(
        shader,
        source
    );

    gl.compileShader(
        shader
    );

    if (
        !gl.getShaderParameter(
            shader,
            gl.COMPILE_STATUS
        )
    ) {

        const error =
            gl.getShaderInfoLog(
                shader
            );

        showError(
            "Shader error: " +
            error
        );

        throw new Error(error);
    }

    return shader;
}


/* =========================================================
   PROGRAM
   ========================================================= */

function createProgram() {

    const vertex =
        createShader(
            gl.VERTEX_SHADER,
            vertexShaderSource
        );

    const fragment =
        createShader(
            gl.FRAGMENT_SHADER,
            fragmentShaderSource
        );

    const program =
        gl.createProgram();

    gl.attachShader(
        program,
        vertex
    );

    gl.attachShader(
        program,
        fragment
    );

    gl.linkProgram(
        program
    );

    if (
        !gl.getProgramParameter(
            program,
            gl.LINK_STATUS
        )
    ) {

        const error =
            gl.getProgramInfoLog(
                program
            );

        showError(
            "Program error: " +
            error
        );

        throw new Error(error);
    }

    return program;
}


let program;

try {

    program =
        createProgram();

    gl.useProgram(
        program
    );

} catch (error) {

    console.error(error);
}


/* =========================================================
   FULLSCREEN TRIANGLE
   ========================================================= */

const buffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ARRAY_BUFFER,
    buffer
);

gl.bufferData(
    gl.ARRAY_BUFFER,

    new Float32Array([
        -1, -1,
         3, -1,
        -1,  3
    ]),

    gl.STATIC_DRAW
);


const position =
    gl.getAttribLocation(
        program,
        "a_position"
    );

gl.enableVertexAttribArray(
    position
);

gl.vertexAttribPointer(
    position,
    2,
    gl.FLOAT,
    false,
    0,
    0
);


/* =========================================================
   UNIFORMS
   ========================================================= */

const U = {

    image:
        gl.getUniformLocation(
            program,
            "u_image"
        ),

    aspect:
        gl.getUniformLocation(
            program,
            "u_aspect"
        ),

    imageAspect:
        gl.getUniformLocation(
            program,
            "u_imageAspect"
        ),

    resolution:
        gl.getUniformLocation(
            program,
            "u_resolution"
        ),

    angle:
        gl.getUniformLocation(
            program,
            "u_angle"
        ),

    hinge:
        gl.getUniformLocation(
            program,
            "u_hinge"
        ),

    screenWidthMm:
        gl.getUniformLocation(
            program,
            "u_screenWidthMm"
        ),

    viewDistanceMm:
        gl.getUniformLocation(
            program,
            "u_viewDistanceMm"
        ),

    blurPerMm:
        gl.getUniformLocation(
            program,
            "u_blurPerMm"
        ),

    maxBlurPx:
        gl.getUniformLocation(
            program,
            "u_maxBlurPx"
        ),

    darkenPerMm:
        gl.getUniformLocation(
            program,
            "u_darkenPerMm"
        ),

    maxDarken:
        gl.getUniformLocation(
            program,
            "u_maxDarken"
        )
};


/* =========================================================
   IMAGE
   ========================================================= */

const texture =
    gl.createTexture();

const image =
    new Image();


image.onload =
    function() {

        gl.bindTexture(
            gl.TEXTURE_2D,
            texture
        );

        gl.pixelStorei(
            gl.UNPACK_FLIP_Y_WEBGL,
            true
        );

        gl.texImage2D(
            gl.TEXTURE_2D,
            0,
            gl.RGBA,
            gl.RGBA,
            gl.UNSIGNED_BYTE,
            image
        );

        gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_MIN_FILTER,
            gl.LINEAR
        );

        gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_MAG_FILTER,
            gl.LINEAR
        );

        gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_WRAP_S,
            gl.CLAMP_TO_EDGE
        );

        gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_WRAP_T,
            gl.CLAMP_TO_EDGE
        );

        gl.activeTexture(
            gl.TEXTURE0
        );

        gl.bindTexture(
            gl.TEXTURE_2D,
            texture
        );

        gl.uniform1i(
            U.image,
            0
        );

        gl.uniform1f(
            U.imageAspect,
            image.width /
            image.height
        );

        resize();

        requestAnimationFrame(
            render
        );
    };


image.onerror =
    function() {

        showError(
            "Could not load lockscreen.png"
        );
    };


image.src =
    "lockscreen.png";


/* =========================================================
   MOTION
   ========================================================= */

let rawTilt = 0;

let targetTilt = 0;

let currentTilt = 0;

let zeroTilt = 0;

let sensorReady = false;


/* =========================================================
   DEVICE ORIENTATION
   ========================================================= */

function handleOrientation(event) {

    if (
        event.gamma === null ||
        event.gamma === undefined
    ) {
        return;
    }

    rawTilt =
        event.gamma;

    targetTilt =
        rawTilt -
        zeroTilt;

    targetTilt =
        Math.max(
            -45,
            Math.min(
                45,
                targetTilt
            )
        );

    sensorReady =
        true;
}


/* =========================================================
   CALIBRATION
   ========================================================= */

function calibrate() {

    if (!sensorReady) {

        zeroTilt = 0;
        targetTilt = 0;
        currentTilt = 0;

        return;
    }

    zeroTilt =
        rawTilt;

    targetTilt =
        0;

    currentTilt =
        0;
}


/* =========================================================
   PERMISSION
   ========================================================= */

const permission =
    document.getElementById(
        "permission"
    );

const startButton =
    document.getElementById(
        "start"
    );

const recalibrateButton =
    document.getElementById(
        "recalibrate"
    );


startButton.addEventListener(
    "click",
    async function() {

        try {

            if (
                typeof DeviceOrientationEvent !==
                "undefined" &&

                typeof DeviceOrientationEvent
                    .requestPermission ===
                "function"
            ) {

                const result =
                    await DeviceOrientationEvent
                        .requestPermission();

                if (
                    result !==
                    "granted"
                ) {

                    showError(
                        "Motion permission was denied."
                    );

                    return;
                }
            }


            window.addEventListener(
                "deviceorientation",
                handleOrientation,
                true
            );


            permission.style.display =
                "none";


            recalibrateButton.style.display =
                "block";


            setTimeout(
                calibrate,
                700
            );

        } catch (error) {

            showError(
                error.message ||
                String(error)
            );
        }
    }
);


/* =========================================================
   RECALIBRATE
   ========================================================= */

recalibrateButton.addEventListener(
    "click",
    calibrate
);


/* =========================================================
   DESKTOP TEST
   ========================================================= */

let dragging = false;


window.addEventListener(
    "pointerdown",
    function() {

        dragging = true;
    }
);


window.addEventListener(
    "pointerup",
    function() {

        dragging = false;
    }
);


window.addEventListener(
    "pointercancel",
    function() {

        dragging = false;
    }
);


window.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging) {
            return;
        }

        const x =
            event.clientX /
            window.innerWidth;

        targetTilt =
            (x - 0.5) *
            90;
    }
);


/* =========================================================
   RESIZE
   ========================================================= */

function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.round(
            window.innerWidth *
            dpr
        );

    canvas.height =
        Math.round(
            window.innerHeight *
            dpr
        );

    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );

    gl.uniform1f(
        U.aspect,
        window.innerWidth /
        window.innerHeight
    );

    gl.uniform2f(
        U.resolution,
        canvas.width,
        canvas.height
    );
}


window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   RENDER
   ========================================================= */

function render() {

    /*
       Smooth response.
    */

    currentTilt +=
        (
            targetTilt -
            currentTilt
        ) * 0.085;


    const angle =
        currentTilt *
        Math.PI /
        180;


    /*
       Right tilt:
           LEFT hinge

       Left tilt:
           RIGHT hinge
    */

    const hinge =
        currentTilt >= 0
            ? -1
            : 1;


    /*
       Physical parameters from the
       reference implementation.
    */

    gl.uniform1f(
        U.screenWidthMm,
        70.0
    );

    gl.uniform1f(
        U.viewDistanceMm,
        320.0
    );

    gl.uniform1f(
        U.blurPerMm,
        0.55
    );

    gl.uniform1f(
        U.maxBlurPx,
        24.0
    );

    gl.uniform1f(
        U.darkenPerMm,
        0.012
    );

    gl.uniform1f(
        U.maxDarken,
        0.55
    );


    gl.uniform1f(
        U.angle,
        angle
    );

    gl.uniform1f(
        U.hinge,
        hinge
    );


    gl.drawArrays(
        gl.TRIANGLES,
        0,
        3
    );


    requestAnimationFrame(
        render
    );
}


/* =========================================================
   GLOBAL ERROR
   ========================================================= */

window.addEventListener(
    "error",
    function(event) {

        if (
            event.message &&
            event.message !==
            "Script error."
        ) {

            showError(
                event.message
            );
        }
    }
);

</script>

</body>
</html>
