<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Tilt</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #orb {
      position: absolute;

      width: 220px;
      height: 220px;

      left: 50%;
      top: 50%;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          #ffffff 0%,
          #c9f6ff 8%,
          #72dfff 20%,
          #168cff 45%,
          #0047ff 65%,
          rgba(0, 71, 255, 0) 78%
        );

      filter: blur(18px);

      transform:
        translate(-50%, -50%)
        scaleX(1)
        scaleY(1)
        rotate(0deg);

      will-change: transform;

      transition: none;
    }

    #motionButton {
      position: fixed;

      z-index: 10;

      top: 30px;
      left: 50%;

      transform: translateX(-50%);

      padding: 12px 20px;

      border: none;
      border-radius: 30px;

      background: white;
      color: black;

      font-size: 16px;

      cursor: pointer;
    }

    #motionButton:active {
      transform: translateX(-50%) scale(0.96);
    }
  </style>
</head>

<body>

  <button id="motionButton">
    Enable Motion
  </button>

  <div id="orb"></div>


  <script>

    const orb = document.getElementById("orb");
    const button = document.getElementById("motionButton");


    let targetX = 0;
    let currentX = 0;

    let targetStretch = 1;
    let currentStretch = 1;

    let targetSquash = 1;
    let currentSquash = 1;

    let targetRotation = 0;
    let currentRotation = 0;


    button.addEventListener("click", async () => {

      if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
      ) {

        try {

          const permission =
            await DeviceOrientationEvent.requestPermission();

          if (permission === "granted") {

            startMotion();

            button.textContent = "Motion Enabled";

          } else {

            button.textContent = "Permission Denied";

          }

        } catch (error) {

          console.error(error);

          button.textContent = "Motion Error";

        }

      } else {

        startMotion();

        button.textContent = "Motion Enabled";

      }

    });


    function startMotion() {

      window.addEventListener(
        "deviceorientation",
        (event) => {

          const tilt = event.gamma || 0;

          /*
            Convert phone tilt
            into a smooth -1 → 1 value
          */

          const movement =
            Math.max(
              -1,
              Math.min(1, tilt / 30)
            );


          /*
            Position
          */

          targetX = movement * 260;


          /*
            Fluid stretching

            More tilt =
            more stretching
          */

          const intensity = Math.abs(movement);

          targetStretch =
            1 + intensity * 0.55;

          targetSquash =
            1 - intensity * 0.22;


          /*
            Rotate slightly
          */

          targetRotation =
            movement * 12;

        }
      );


      animate();

    }


    function animate() {

      /*
        Elastic smoothing

        Smaller number =
        more liquid / delayed
        movement
      */

      currentX +=
        (targetX - currentX) * 0.08;

      currentStretch +=
        (targetStretch - currentStretch) * 0.08;

      currentSquash +=
        (targetSquash - currentSquash) * 0.08;

      currentRotation +=
        (targetRotation - currentRotation) * 0.08;


      /*
        Apply the deformation
      */

      orb.style.transform = `
        translate(
          calc(-50% + ${currentX}px),
          -50%
        )
        scaleX(${currentStretch})
        scaleY(${currentSquash})
        rotate(${currentRotation}deg)
      `;


      requestAnimationFrame(animate);

    }

  </script>

</body>
</html>
