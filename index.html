<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">

  <title>Fluid</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    #scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 50%,
          #020711 0%,
          #000 70%
        );
    }

    /* Large atmospheric glow */

    #ambient {
      position: absolute;
      left: 50%;
      top: 50%;

      width: 70vmin;
      height: 70vmin;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background: rgba(0, 80, 255, 0.15);

      filter: blur(100px);

      pointer-events: none;
    }

    /* The actual fluid */

    #fluid {
      position: absolute;

      left: 50%;
      top: 50%;

      width: min(62vmin, 420px);
      height: min(62vmin, 420px);

      transform: translate(-50%, -50%);

      border-radius: 48% 52% 50% 50% / 52% 48% 52% 48%;

      background:
        radial-gradient(
          circle at 34% 27%,
          #ffffff 0%,
          #e5fbff 5%,
          #a4efff 13%,
          #4dd3ff 25%,
          #168cff 44%,
          #0047ff 62%,
          #002baf 74%,
          rgba(0, 35, 160, 0) 82%
        );

      filter: blur(8px);

      will-change: transform, border-radius;

      box-shadow:
        0 0 80px rgba(0, 90, 255, 0.35);
    }

    /* Soft liquid aura */

    #aura {
      position: absolute;

      left: 50%;
      top: 50%;

      width: min(75vmin, 500px);
      height: min(75vmin, 500px);

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(0, 110, 255, 0.16),
          transparent 68%
        );

      filter: blur(45px);

      pointer-events: none;
    }

    /* Intro */

    #intro {
      position: fixed;
      inset: 0;

      z-index: 20;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background: rgba(0, 0, 0, 0.76);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }

    #intro.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #title {
      color: white;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        sans-serif;

      font-size: 30px;
      font-weight: 500;

      letter-spacing: -0.8px;
    }

    #description {
      margin-top: 12px;

      max-width: 270px;

      color: rgba(255,255,255,0.5);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      font-size: 14px;

      line-height: 1.5;

      text-align: center;
    }

    #motionButton {
      margin-top: 24px;

      padding: 14px 25px;

      border: 0;
      border-radius: 30px;

      background: white;
      color: black;

      font-size: 15px;
      font-weight: 500;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
    }

    #hint {
      position: fixed;

      z-index: 10;

      left: 50%;
      bottom: calc(32px + env(safe-area-inset-bottom));

      transform: translateX(-50%);

      color: rgba(255,255,255,0.35);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      font-size: 13px;

      white-space: nowrap;

      opacity: 0;

      transition: opacity 1s ease;
    }

    #hint.visible {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div id="scene">

    <div id="aura"></div>

    <div id="ambient"></div>

    <div id="fluid"></div>

  </div>


  <div id="intro">

    <div id="title">
      Fluid
    </div>

    <div id="description">
      Tilt your phone and move the fluid through space.
    </div>

    <button id="motionButton">
      Begin Experience
    </button>

  </div>


  <div id="hint">
    Tilt and move your phone
  </div>


  <script>

    const fluid =
      document.getElementById("fluid");

    const aura =
      document.getElementById("aura");

    const ambient =
      document.getElementById("ambient");

    const intro =
      document.getElementById("intro");

    const button =
      document.getElementById("motionButton");

    const hint =
      document.getElementById("hint");


    let targetX = 0;
    let targetY = 0;

    let x = 0;
    let y = 0;

    let lastX = 0;
    let lastY = 0;

    let velocityX = 0;
    let velocityY = 0;

    let time = 0;


    button.addEventListener(
      "click",
      async () => {

        try {

          if (
            typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function"
          ) {

            const permission =
              await DeviceOrientationEvent.requestPermission();

            if (permission !== "granted") {
              return;
            }

          }

          startMotion();

          intro.classList.add("hidden");

          setTimeout(() => {
            hint.classList.add("visible");
          }, 700);

          setTimeout(() => {
            hint.classList.remove("visible");
          }, 4500);

        } catch (error) {

          console.error(error);

        }

      }
    );


    function startMotion() {

      window.addEventListener(
        "deviceorientation",
        (event) => {

          const gamma =
            event.gamma || 0;

          const beta =
            event.beta || 45;


          /*
            Horizontal tilt
          */

          const horizontal =
            Math.max(
              -1,
              Math.min(1, gamma / 35)
            );


          /*
            Vertical tilt
          */

          const vertical =
            Math.max(
              -1,
              Math.min(1, (beta - 45) / 35)
            );


          targetX =
            horizontal * 280;

          targetY =
            vertical * 150;

        }
      );


      animate();

    }


    function animate() {

      time += 0.016;


      /*
        Elastic movement
      */

      x +=
        (targetX - x) * 0.065;

      y +=
        (targetY - y) * 0.065;


      /*
        Velocity
      */

      velocityX =
        x - lastX;

      velocityY =
        y - lastY;

      lastX = x;
      lastY = y;


      const speed =
        Math.sqrt(
          velocityX * velocityX +
          velocityY * velocityY
        );


      /*
        Direction
      */

      const angle =
        Math.atan2(
          velocityY,
          velocityX
        ) * 180 / Math.PI;


      /*
        Stretch based on speed
      */

      const stretch =
        Math.min(
          1.7,
          1 + speed * 0.025
        );


      const squash =
        Math.max(
          0.7,
          1 - speed * 0.012
        );


      /*
        Organic breathing movement
      */

      const wobble =
        Math.sin(time * 2.2) * 1.5;


      /*
        Change blob shape dynamically
      */

      const shape =
        50 + wobble;


      fluid.style.borderRadius = `
        ${shape}% ${100 - shape}%
        ${48 + wobble / 2}% ${52 - wobble / 2}%
        /
        ${52 - wobble / 2}% ${48 + wobble / 2}%
        ${50 + wobble}% ${50 - wobble}%
      `;


      /*
        Main fluid transformation
      */

      fluid.style.transform = `
        translate(
          calc(-50% + ${x}px),
          calc(-50% + ${y}px)
        )
        rotate(${angle}deg)
        scaleX(${stretch})
        scaleY(${squash})
      `;


      /*
        Aura follows the fluid
        with extra softness
      */

      aura.style.transform = `
        translate(
          calc(-50% + ${x * 0.75}px),
          calc(-50% + ${y * 0.75}px)
        )
        scale(${1 + speed * 0.008})
      `;


      ambient.style.transform = `
        translate(
          calc(-50% + ${x * 0.35}px),
          calc(-50% + ${y * 0.35}px)
        )
      `;


      requestAnimationFrame(animate);

    }

  </script>

</body>
</html>
