<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">

<title>Duo Lock Screen</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
}

body {
    position: fixed;
    inset: 0;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}


/* =========================
   PERMISSION
   ========================= */

#permission {

    position: fixed;
    inset: 0;
    z-index: 100;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 30px;

    background: #000;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        sans-serif;

    text-align: center;
}

#permission h1 {

    margin: 0 0 12px;

    font-size: 28px;
    font-weight: 600;
}

#permission p {

    max-width: 300px;

    margin: 0 0 28px;

    font-size: 15px;
    line-height: 1.5;

    opacity: .6;
}

#start {

    border: 0;
    outline: none;

    padding: 14px 26px;

    border-radius: 999px;

    background: #fff;
    color: #000;

    font-size: 16px;
    font-weight: 600;
}

#start:active {
    transform: scale(.97);
}


/* =========================
   RECALIBRATE
   ========================= */

#recalibrate {

    position: fixed;

    z-index: 50;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    display: none;

    border: 0;

    padding: 9px 16px;

    border-radius: 999px;

    background: rgba(0,0,0,.45);

    color: rgba(255,255,255,.85);

    backdrop-filter: blur(10px);

    font-size: 12px;
}


/* =========================
   ERROR
   ========================= */

#error {

    position: fixed;

    z-index: 200;

    left: 20px;
    right: 20px;
    bottom: 20px;

    display: none;

    padding: 15px;

    border-radius: 12px;

    background: #400;

    color: #fff;

    font-family: monospace;

    font-size: 12px;

    line-height: 1.4;

    word-break: break-word;
}

</style>

</head>


<body>


<div id="permission">

    <h1>Duo Effect</h1>

    <p>
        Hold your iPhone normally and enable motion.
        Then tilt left and right.
    </p>

    <button id="start">
        Enable Motion
    </button>

</div>


<canvas id="canvas"></canvas>


<button id="recalibrate">
    Recalibrate
</button>


<div id="error"></div>


<script>


/* =========================================================
   ERROR
   ========================================================= */

const errorBox =
    document.getElementById("error");


function showError(message) {

    console.error(message);

    errorBox.textContent =
        "Error: " + message;

    errorBox.style.display =
        "block";
}


/* =========================================================
   WEBGL
   ========================================================= */

const canvas =
    document.getElementById("canvas");


const gl =
    canvas.getContext(
        "webgl",
        {
            alpha: false,
            antialias: false,
            premultipliedAlpha: false
        }
    );


if (!gl) {

    showError(
        "WebGL is not supported on this device."
    );

}


/* =========================================================
   VERTEX SHADER
   ========================================================= */

const vertexShaderSource = `

attribute vec2 a_position;

varying vec2 v_uv;

void main() {

    v_uv =
        a_position * 0.5 +
        0.5;

    gl_Position =
        vec4(
            a_position,
            0.0,
            1.0
        );
}

`;


/* =========================================================
   FRAGMENT SHADER
   =========================================================

   This is deliberately based on the geometry of the
   Android DuoFold shader:

   screen pixel
        ↓
   rotated glass
        ↓
   eye → glass ray
        ↓
   original UI plane
        ↓
   projected image point
        ↓
   gap-based Vogel blur
*/


const fragmentShaderSource = `

precision highp float;

varying vec2 v_uv;


/* Image */

uniform sampler2D u_image;


/* Screen */

uniform vec2 u_resolution;

uniform float u_imageAspect;


/* Fold */

uniform float u_tiltDegrees;

uniform float u_hingeSide;


/* Physical parameters */

uniform float u_eyeDistance;

uniform float u_blurSpread;

uniform float u_darkening;


/* =========================================================
   IMAGE COVER
   ========================================================= */

vec2 imageUV(vec2 uv) {

    float screenAspect =
        u_resolution.x /
        u_resolution.y;

    float imageAspect =
        u_imageAspect;


    vec2 scale =
        vec2(1.0);


    if (
        screenAspect >
        imageAspect
    ) {

        scale.y =
            imageAspect /
            screenAspect;

    } else {

        scale.x =
            screenAspect /
            imageAspect;
    }


    return
        (uv - 0.5)
        *
        scale
        +
        0.5;
}


/* =========================================================
   IMAGE SAMPLE
   ========================================================= */

vec4 sampleImage(
    vec2 uv
) {

    vec2 p =
        imageUV(uv);


    if (
        p.x < 0.0 ||
        p.x > 1.0 ||
        p.y < 0.0 ||
        p.y > 1.0
    ) {

        return vec4(0.0);
    }


    return texture2D(
        u_image,
        p
    );
}


/* =========================================================
   VOGEL DISK BLUR
   =========================================================

   Same principle as the Android shader.

   32 samples with a golden-angle distribution.
*/

vec4 vogelBlur(
    vec2 hit,
    float radius
) {

    if (
        radius < 0.5
    ) {

        return sampleImage(
            hit /
            u_resolution
        );
    }


    const float GOLDEN =
        2.399963229728653;


    const float TWO_PI =
        6.283185307179586;


    float taps =
        clamp(
            radius * 2.0,
            6.0,
            32.0
        );


    /*
       Per-pixel random rotation.

       This prevents obvious circular banding.
    */

    float rotation =
        fract(
            sin(
                dot(
                    hit,
                    vec2(
                        12.9898,
                        78.233
                    )
                )
            )
            *
            43758.5453
        )
        *
        TWO_PI;


    vec3 sum =
        vec3(0.0);


    float weightSum =
        0.0;


    for (
        int i = 0;
        i < 32;
        i++
    ) {

        float fi =
            float(i);


        /*
           Enable only required taps.
        */

        float weight =
            1.0 -
            step(
                taps,
                fi
            );


        /*
           Vogel disk radius.
        */

        float sampleRadius =
            radius *
            sqrt(
                (fi + 0.5)
                /
                taps
            );


        /*
           Golden-angle distribution.
        */

        float a =
            fi *
            GOLDEN
            +
            rotation;


        vec2 offset =
            sampleRadius *
            vec2(
                cos(a),
                sin(a)
            );


        vec2 samplePixel =
            hit +
            offset;


        vec2 sampleUV =
            samplePixel /
            u_resolution;


        sum +=
            sampleImage(
                sampleUV
            ).rgb
            *
            weight;


        weightSum +=
            weight;
    }


    vec3 average =
        sum /
        max(
            weightSum,
            1.0
        );


    return
        vec4(
            average,
            1.0
        );
}


/* =========================================================
   MAIN
   ========================================================= */

void main() {


    /* =====================================================
       ZERO TILT
       ===================================================== */

    if (
        abs(u_tiltDegrees)
        < 0.001
    ) {

        gl_FragColor =
            sampleImage(v_uv);

        return;
    }


    /* =====================================================
       ABSOLUTE TILT

       Reference shader uses absolute angle for the
       physical fold geometry.
       ===================================================== */

    float tilt =
        radians(
            clamp(
                abs(u_tiltDegrees),
                0.0,
                45.0
            )
        );


    if (
        tilt < 0.00001
    ) {

        gl_FragColor =
            sampleImage(v_uv);

        return;
    }


    /* =====================================================
       SCREEN PIXEL
       ===================================================== */

    vec2 fragCoord =
        v_uv *
        u_resolution;


    vec2 size =
        u_resolution;


    /* =====================================================
       HINGE

       +1 = RIGHT
       -1 = LEFT
       ===================================================== */

    float isRight =
        step(
            0.0,
            u_hingeSide
        );


    float hingeX =
        mix(
            0.0,
            size.x,
            isRight
        );


    /*
       Direction away from hinge.

       Right hinge:
           side = -1

       Left hinge:
           side = +1
    */

    float side =
        mix(
            1.0,
            -1.0,
            isRight
        );


    /* =====================================================
       DISTANCE FROM HINGE
       ===================================================== */

    float d =
        abs(
            fragCoord.x -
            hingeX
        );


    /* =====================================================
       ROTATED GLASS
       ===================================================== */

    vec2 glass =
        vec2(
            hingeX
            +
            side *
            d *
            cos(tilt),

            fragCoord.y
        );


    /* =====================================================
       GLASS → SCREEN GAP
       ===================================================== */

    float gap =
        d *
        sin(tilt);


    /* =====================================================
       EYE
       ===================================================== */

    vec2 eye =
        size *
        0.5;


    /* =====================================================
       DEPTH

       The original Android shader uses:

           depth =
               eyeDistance -
               gap
       ===================================================== */

    float depth =
        u_eyeDistance -
        gap;


    /*
       If the glass has moved beyond the eye,
       the ray misses completely.
    */

    if (
        depth <= 0.001
    ) {

        gl_FragColor =
            vec4(
                0.0,
                0.0,
                0.0,
                1.0
            );

        return;
    }


    /* =====================================================
       RAY PROJECTION
       ===================================================== */

    float t =
        u_eyeDistance /
        depth;


    vec2 hit =
        eye
        +
        (
            glass -
            eye
        )
        *
        t;


    /* =====================================================
       BLUR RADIUS
       ===================================================== */

    float radius =
        u_blurSpread *
        gap;


    /*
       24px maximum, matching the reference tuning.
    */

    radius =
        min(
            radius,
            24.0
        );


    /* =====================================================
       WHOLE KERNEL MISS
       ===================================================== */

    if (
        hit.x <
        -radius ||

        hit.y <
        -radius ||

        hit.x >
        size.x +
        radius ||

        hit.y >
        size.y +
        radius
    ) {

        gl_FragColor =
            vec4(
                0.0,
                0.0,
                0.0,
                1.0
            );

        return;
    }


    /* =====================================================
       DARKENING
       ===================================================== */

    float attenuation =
        max(
            1.0 -
            u_darkening *
            radius,

            0.0
        );


    /* =====================================================
       BLUR
       ===================================================== */

    vec4 color =
        vogelBlur(
            hit,
            radius
        );


    color.rgb *=
        attenuation;


    gl_FragColor =
        color;
}

`;


/* =========================================================
   SHADER CREATION
   ========================================================= */

function createShader(
    type,
    source
) {

    const shader =
        gl.createShader(type);


    gl.shaderSource(
        shader,
        source
    );


    gl.compileShader(
        shader
    );


    if (
        !gl.getShaderParameter(
            shader,
            gl.COMPILE_STATUS
        )
    ) {

        const message =
            gl.getShaderInfoLog(
                shader
            );

        showError(
            "Shader error: " +
            message
        );

        throw new Error(
            message
        );
    }


    return shader;
}


/* =========================================================
   PROGRAM
   ========================================================= */

function createProgram() {

    const vertex =
        createShader(
            gl.VERTEX_SHADER,
            vertexShaderSource
        );


    const fragment =
        createShader(
            gl.FRAGMENT_SHADER,
            fragmentShaderSource
        );


    const program =
        gl.createProgram();


    gl.attachShader(
        program,
        vertex
    );


    gl.attachShader(
        program,
        fragment
    );


    gl.linkProgram(
        program
    );


    if (
        !gl.getProgramParameter(
            program,
            gl.LINK_STATUS
        )
    ) {

        const message =
            gl.getProgramInfoLog(
                program
            );

        showError(
            "Program error: " +
            message
        );

        throw new Error(
            message
        );
    }


    return program;
}


let program;

try {

    program =
        createProgram();

    gl.useProgram(
        program
    );

} catch (error) {

    console.error(error);
}


/* =========================================================
   FULLSCREEN TRIANGLE
   ========================================================= */

const buffer =
    gl.createBuffer();


gl.bindBuffer(
    gl.ARRAY_BUFFER,
    buffer
);


gl.bufferData(
    gl.ARRAY_BUFFER,

    new Float32Array([
        -1, -1,
         3, -1,
        -1,  3
    ]),

    gl.STATIC_DRAW
);


const position =
    gl.getAttribLocation(
        program,
        "a_position"
    );


gl.enableVertexAttribArray(
    position
);


gl.vertexAttribPointer(
    position,
    2,
    gl.FLOAT,
    false,
    0,
    0
);


/* =========================================================
   UNIFORMS
   ========================================================= */

const U = {

    image:
        gl.getUniformLocation(
            program,
            "u_image"
        ),

    resolution:
        gl.getUniformLocation(
            program,
            "u_resolution"
        ),

    imageAspect:
        gl.getUniformLocation(
            program,
            "u_imageAspect"
        ),

    tiltDegrees:
        gl.getUniformLocation(
            program,
            "u_tiltDegrees"
        ),

    hingeSide:
        gl.getUniformLocation(
            program,
            "u_hingeSide"
        ),

    eyeDistance:
        gl.getUniformLocation(
            program,
            "u_eyeDistance"
        ),

    blurSpread:
        gl.getUniformLocation(
            program,
            "u_blurSpread"
        ),

    darkening:
        gl.getUniformLocation(
            program,
            "u_darkening"
        )
};


/* =========================================================
   IMAGE TEXTURE
   ========================================================= */

const texture =
    gl.createTexture();


const image =
    new Image();


image.onload =
    function() {

        gl.bindTexture(
            gl.TEXTURE_2D,
            texture
        );


        gl.pixelStorei(
            gl.UNPACK_FLIP_Y_WEBGL,
            true
        );


        gl.texImage2D(
            gl.TEXTURE_2D,
            0,
            gl.RGBA,
            gl.RGBA,
            gl.UNSIGNED_BYTE,
            image
        );


        gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_MIN_FILTER,
            gl.LINEAR
        );


        gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_MAG_FILTER,
            gl.LINEAR
        );


        gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_WRAP_S,
            gl.CLAMP_TO_EDGE
        );


        gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_WRAP_T,
            gl.CLAMP_TO_EDGE
        );


        gl.activeTexture(
            gl.TEXTURE0
        );


        gl.bindTexture(
            gl.TEXTURE_2D,
            texture
        );


        gl.uniform1i(
            U.image,
            0
        );


        gl.uniform1f(
            U.imageAspect,
            image.width /
            image.height
        );


        resize();


        requestAnimationFrame(
            render
        );
    };


image.onerror =
    function() {

        showError(
            "Could not load lockscreen.png"
        );
    };


image.src =
    "lockscreen.png";


/* =========================================================
   MOTION
   ========================================================= */

let rawTilt =
    0;

let targetTilt =
    0;

let currentTilt =
    0;

let zeroTilt =
    0;

let sensorReady =
    false;


/* =========================================================
   ORIENTATION
   ========================================================= */

function handleOrientation(
    event
) {

    if (
        event.gamma === null ||
        event.gamma === undefined
    ) {

        return;
    }


    rawTilt =
        event.gamma;


    targetTilt =
        rawTilt -
        zeroTilt;


    targetTilt =
        Math.max(
            -45,
            Math.min(
                45,
                targetTilt
            )
        );


    sensorReady =
        true;
}


/* =========================================================
   CALIBRATE
   ========================================================= */

function calibrate() {

    if (!sensorReady) {

        zeroTilt =
            0;

        targetTilt =
            0;

        currentTilt =
            0;

        return;
    }


    zeroTilt =
        rawTilt;


    targetTilt =
        0;


    currentTilt =
        0;
}


/* =========================================================
   PERMISSION
   ========================================================= */

const permission =
    document.getElementById(
        "permission"
    );


const startButton =
    document.getElementById(
        "start"
    );


const recalibrateButton =
    document.getElementById(
        "recalibrate"
    );


startButton.addEventListener(
    "click",
    async function() {

        try {

            if (
                typeof DeviceOrientationEvent !==
                "undefined" &&

                typeof DeviceOrientationEvent
                    .requestPermission ===
                "function"
            ) {

                const result =
                    await DeviceOrientationEvent
                        .requestPermission();


                if (
                    result !==
                    "granted"
                ) {

                    showError(
                        "Motion permission was denied."
                    );

                    return;
                }
            }


            window.addEventListener(
                "deviceorientation",
                handleOrientation,
                true
            );


            permission.style.display =
                "none";


            recalibrateButton.style.display =
                "block";


            setTimeout(
                calibrate,
                700
            );

        } catch (error) {

            showError(
                error.message ||
                String(error)
            );
        }
    }
);


/* =========================================================
   RECALIBRATE
   ========================================================= */

recalibrateButton.addEventListener(
    "click",
    calibrate
);


/* =========================================================
   DESKTOP TEST
   ========================================================= */

let dragging =
    false;


window.addEventListener(
    "pointerdown",
    function() {

        dragging =
            true;
    }
);


window.addEventListener(
    "pointerup",
    function() {

        dragging =
            false;
    }
);


window.addEventListener(
    "pointercancel",
    function() {

        dragging =
            false;
    }
);


window.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging) {
            return;
        }


        const x =
            event.clientX /
            window.innerWidth;


        targetTilt =
            (x - 0.5) *
            90;
    }
);


/* =========================================================
   RESIZE
   ========================================================= */

function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        Math.round(
            window.innerWidth *
            dpr
        );


    canvas.height =
        Math.round(
            window.innerHeight *
            dpr
        );


    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );


    gl.uniform2f(
        U.resolution,
        canvas.width,
        canvas.height
    );
}


window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   RENDER
   ========================================================= */

function render() {

    /*
       Smooth sensor response.
    */

    currentTilt +=
        (
            targetTilt -
            currentTilt
        )
        *
        0.10;


    /*
       -----------------------------------------------------
       IMPORTANT SIGN MAPPING
       -----------------------------------------------------

       Reference:

       + tilt → RIGHT hinge
       - tilt → LEFT hinge

       This is different from our previous versions.
    */

    const hingeSide =
        currentTilt >= 0
            ? 1.0
            : -1.0;


    /*
       Reference shader:

       eyeDistancePx
           = 320-ish

       blurSpread
           = 0.55

       darkening
           = 0.012
    */

    gl.uniform1f(
        U.eyeDistance,
        320.0
    );


    gl.uniform1f(
        U.blurSpread,
        0.55
    );


    gl.uniform1f(
        U.darkening,
        0.012
    );


    gl.uniform1f(
        U.tiltDegrees,
        currentTilt
    );


    gl.uniform1f(
        U.hingeSide,
        hingeSide
    );


    gl.drawArrays(
        gl.TRIANGLES,
        0,
        3
    );


    requestAnimationFrame(
        render
    );
}


/* =========================================================
   GLOBAL ERROR
   ========================================================= */

window.addEventListener(
    "error",
    function(event) {

        if (
            event.message &&
            event.message !==
            "Script error."
        ) {

            showError(
                event.message
            );
        }
    }
);

</script>

</body>
</html>
