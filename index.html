<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Duo Fold</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #08090c;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Helvetica Neue", sans-serif;
    color: white;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

/* --------------------------------------------------
   STAGE
-------------------------------------------------- */

.stage {
    width: 100vw;
    height: 100vh;

    perspective: 320mm;
    perspective-origin: center center;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

/* --------------------------------------------------
   FOLD
-------------------------------------------------- */

.fold {
    position: relative;

    width: min(92vw, 430px);
    height: min(88vh, 760px);

    transform-style: preserve-3d;

    transition: transform 0.08s linear;
}

/*
   The screen is divided into two physical planes.
   The center is the hinge.
*/

.panel {
    position: absolute;
    top: 0;

    width: 50%;
    height: 100%;

    overflow: hidden;

    backface-visibility: hidden;
    transform-style: preserve-3d;

    background: #111318;
}

.panel.left {
    left: 0;
    transform-origin: right center;
}

.panel.right {
    right: 0;
    transform-origin: left center;
}

/* --------------------------------------------------
   CONTENT
-------------------------------------------------- */

.content {
    position: absolute;
    top: 0;

    width: 200%;
    height: 100%;

    padding: 34px;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(255,255,255,.08),
            transparent 35%
        ),
        linear-gradient(
            160deg,
            #171a21 0%,
            #0d0f14 55%,
            #08090c 100%
        );
}

.left .content {
    left: 0;
}

.right .content {
    right: 0;
    transform: translateX(0);
}

/* --------------------------------------------------
   DEMO UI
-------------------------------------------------- */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 38px;
}

.logo {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.03em;
}

.status {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #62e6a7;
    box-shadow: 0 0 18px rgba(98,230,167,.6);
}

.hero {
    margin-bottom: 35px;
}

.hero small {
    display: block;

    margin-bottom: 10px;

    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .12em;

    opacity: .45;
}

.hero h1 {
    font-size: clamp(42px, 10vw, 68px);
    line-height: .92;
    letter-spacing: -.065em;
}

.card {
    margin-top: 30px;

    padding: 24px;

    border-radius: 24px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.025)
        );

    border: 1px solid rgba(255,255,255,.09);

    box-shadow:
        0 30px 80px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.08);
}

.card-number {
    font-size: 38px;
    font-weight: 600;
    letter-spacing: -.05em;
}

.card-label {
    margin-top: 5px;
    font-size: 13px;
    opacity: .45;
}

.list {
    margin-top: 35px;
}

.item {
    display: flex;
    justify-content: space-between;

    padding: 18px 0;

    border-bottom: 1px solid rgba(255,255,255,.07);

    font-size: 14px;
}

.item span:last-child {
    opacity: .4;
}

/* --------------------------------------------------
   HINGE
-------------------------------------------------- */

.hinge {
    position: absolute;

    z-index: 20;

    top: 0;
    left: 50%;

    width: 2px;
    height: 100%;

    transform: translateX(-50%);

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255,255,255,.18) 20%,
            rgba(255,255,255,.08) 50%,
            rgba(255,255,255,.18) 80%,
            transparent
        );

    opacity: .35;
}

/* --------------------------------------------------
   GAP SHADOW
-------------------------------------------------- */

.gap {
    position: absolute;

    z-index: 30;

    top: 0;
    left: 50%;

    width: 80px;
    height: 100%;

    transform:
        translateX(-50%)
        scaleX(0);

    transform-origin: center;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,0,0,.7),
            transparent
        );

    filter: blur(12px);

    opacity: 0;

    transition:
        opacity .08s linear,
        transform .08s linear;
}

/* --------------------------------------------------
   CONTROL
-------------------------------------------------- */

.controls {
    position: fixed;

    z-index: 100;

    bottom: 24px;
    left: 50%;

    transform: translateX(-50%);

    padding: 12px 16px;

    border-radius: 100px;

    background: rgba(15,16,20,.72);

    border: 1px solid rgba(255,255,255,.1);

    backdrop-filter: blur(20px);

    display: flex;
    align-items: center;
    gap: 12px;

    font-size: 12px;
}

button {
    border: 0;
    border-radius: 100px;

    padding: 8px 13px;

    color: white;
    background: rgba(255,255,255,.1);

    font: inherit;
}

button:active {
    transform: scale(.96);
}

/* --------------------------------------------------
   MOTION INDICATOR
-------------------------------------------------- */

.angle {
    position: fixed;

    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 100;

    font-size: 11px;
    letter-spacing: .08em;

    opacity: .35;
}

/* --------------------------------------------------
   MOBILE
-------------------------------------------------- */

@media (max-width: 600px) {

    .fold {
        width: 94vw;
        height: 82vh;
    }

    .content {
        padding: 26px;
    }

    .controls {
        bottom: 15px;
    }
}
</style>
</head>

<body>

<div class="stage">

    <div class="fold" id="fold">

        <div class="panel left" id="left">
            <div class="content">
                <div class="header">
                    <div class="logo">DUO</div>
                    <div class="status"></div>
                </div>

                <div class="hero">
                    <small>Interface</small>
                    <h1>Fold<br>the<br>screen.</h1>
                </div>

                <div class="card">
                    <div class="card-number">01</div>
                    <div class="card-label">
                        Physical interface
                    </div>
                </div>
            </div>
        </div>

        <div class="panel right" id="right">
            <div class="content">
                <div class="header">
                    <div class="logo">DUO</div>
                    <div class="status"></div>
                </div>

                <div class="hero">
                    <small>Motion</small>
                    <h1>Move<br>your<br>phone.</h1>
                </div>

                <div class="list">
                    <div class="item">
                        <span>Perspective</span>
                        <span>320mm</span>
                    </div>

                    <div class="item">
                        <span>Blur</span>
                        <span>Dynamic</span>
                    </div>

                    <div class="item">
                        <span>Hinge</span>
                        <span>Live</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="hinge"></div>
        <div class="gap" id="gap"></div>

    </div>

</div>

<div class="angle" id="angle">
    TILT 0°
</div>

<div class="controls">

    <span id="motionStatus">
        Motion: OFF
    </span>

    <button id="motionButton">
        Enable Motion
    </button>

</div>

<script>

/* ==================================================
   DUO FOLD ENGINE
   Reference model:
   - fixed interface plane
   - rotating glass planes
   - central hinge
   - perspective
   - gap proportional shading
================================================== */

const fold = document.getElementById("fold");
const left = document.getElementById("left");
const right = document.getElementById("right");
const gap = document.getElementById("gap");

const angleLabel = document.getElementById("angle");
const motionStatus = document.getElementById("motionStatus");
const motionButton = document.getElementById("motionButton");

let targetAngle = 0;
let currentAngle = 0;

let motionEnabled = false;

const MAX_ANGLE = 45;

/* -----------------------------------------------
   Smooth animation
------------------------------------------------ */

function animate() {

    currentAngle +=
        (targetAngle - currentAngle) * 0.12;

    render(currentAngle);

    requestAnimationFrame(animate);
}

/* -----------------------------------------------
   Render fold
------------------------------------------------ */

function render(angle) {

    const a = Math.max(
        -MAX_ANGLE,
        Math.min(MAX_ANGLE, angle)
    );

    /*
       Each half rotates around the center hinge.

       Positive:
       left opens backward
       right opens forward

       Negative:
       opposite direction.
    */

    left.style.transform =
        `rotateY(${a}deg)`;

    right.style.transform =
        `rotateY(${-a}deg)`;

    /*
       Gap grows with tilt.

       This is the browser approximation
       of the reference shader's gap-dependent
       blur/darken behavior.
    */

    const normalized =
        Math.abs(a) / MAX_ANGLE;

    const gapScale =
        normalized * 1.35;

    gap.style.transform =
        `translateX(-50%) scaleX(${gapScale})`;

    gap.style.opacity =
        normalized * .8;

    /*
       Slight global depth movement.
    */

    fold.style.transform =
        `translateZ(${-normalized * 18}px)`;

    angleLabel.textContent =
        `TILT ${Math.round(a)}°`;
}

/* ==================================================
   DEVICE MOTION
================================================== */

function handleOrientation(event) {

    /*
       beta:
       front/back tilt

       gamma:
       left/right tilt
    */

    let gamma = event.gamma || 0;

    /*
       Clamp physical movement.

       This keeps the interaction
       controllable rather than allowing
       extreme rotations.
    */

    targetAngle =
        Math.max(
            -MAX_ANGLE,
            Math.min(MAX_ANGLE, gamma)
        );
}

/* ==================================================
   iOS PERMISSION
================================================== */

async function enableMotion() {

    /*
       iOS 13+ requires explicit permission
       for DeviceOrientation.
    */

    if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
    ) {

        try {

            const permission =
                await DeviceOrientationEvent.requestPermission();

            if (permission !== "granted") {

                motionStatus.textContent =
                    "Motion: Permission denied";

                return;
            }

        } catch (error) {

            motionStatus.textContent =
                "Motion: Permission error";

            return;
        }
    }

    window.addEventListener(
        "deviceorientation",
        handleOrientation,
        true
    );

    motionEnabled = true;

    motionStatus.textContent =
        "Motion: ON";

    motionButton.textContent =
        "Motion Enabled";
}

/* ==================================================
   BUTTON
================================================== */

motionButton.addEventListener(
    "click",
    enableMotion
);

/* ==================================================
   DESKTOP FALLBACK
================================================== */

window.addEventListener(
    "mousemove",
    event => {

        if (motionEnabled) return;

        const normalized =
            event.clientX / window.innerWidth;

        targetAngle =
            (normalized - .5) * 90;
    }
);

/* ==================================================
   TOUCH FALLBACK
================================================== */

window.addEventListener(
    "touchmove",
    event => {

        if (motionEnabled) return;

        if (!event.touches.length) return;

        const x =
            event.touches[0].clientX;

        const normalized =
            x / window.innerWidth;

        targetAngle =
            (normalized - .5) * 90;
    },
    { passive: true }
);

/* ==================================================
   START
================================================== */

animate();

render(0);

</script>

</body>
</html>
