<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#000000">

<title>Spatial Lock Screen</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;
}

body {
  position: fixed;
  inset: 0;
}

canvas {
  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  display: block;
}


/* ==============================
   START SCREEN
============================== */

#intro {

  position: fixed;

  inset: 0;

  z-index: 10;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  background:
    rgba(0,0,0,0.62);

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  text-align: center;

  transition:
    opacity .8s ease;

}

#intro.hidden {

  opacity: 0;

  pointer-events: none;

}

#intro h1 {

  margin: 0;

  font-size: 30px;

  font-weight: 500;

}

#intro p {

  width: 280px;

  margin:
    12px 0 25px;

  color:
    rgba(255,255,255,.55);

  font-size: 14px;

  line-height: 1.5;

}

#start {

  border: 0;

  border-radius: 30px;

  padding:
    14px 26px;

  background: white;

  color: black;

  font-size: 15px;

  font-weight: 500;

}


/* ==============================
   HINT
============================== */

#hint {

  position: fixed;

  z-index: 5;

  left: 50%;

  bottom:
    calc(
      35px +
      env(safe-area-inset-bottom)
    );

  transform:
    translateX(-50%);

  color:
    rgba(255,255,255,.5);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  font-size: 13px;

  opacity: 0;

  transition:
    opacity 1s ease;

}

#hint.show {
  opacity: 1;
}

</style>

</head>


<body>


<canvas id="canvas"></canvas>


<div id="intro">

  <h1>
    Spatial Wallpaper
  </h1>

  <p>
    Tilt your phone left or right
    to stretch the screen beyond
    its edge.
  </p>

  <button id="start">
    Begin Experience
  </button>

</div>


<div id="hint">
  Tilt left or right
</div>


<script>


/* ==========================================
   CANVAS
========================================== */

const canvas =
  document.getElementById(
    "canvas"
  );

const gl =
  canvas.getContext(
    "webgl",
    {
      antialias: true,
      premultipliedAlpha: false
    }
  );


if (!gl) {

  alert(
    "WebGL is not supported."
  );

}


/* ==========================================
   VERTEX SHADER
========================================== */

const vertexShaderSource = `

attribute vec2 position;

varying vec2 uv;

void main() {

  uv =
    position * 0.5 + 0.5;

  gl_Position =
    vec4(
      position,
      0.0,
      1.0
    );

}

`;


/* ==========================================
   FRAGMENT SHADER
========================================== */

const fragmentShaderSource = `

precision highp float;

uniform sampler2D image;

uniform vec2 resolution;

uniform float tilt;

uniform float time;

varying vec2 uv;


/*
===========================================
SMOOTH EDGE FUNCTION
===========================================
*/

float edgeAmount(
  float x,
  float direction
) {

  /*
    direction:

    +1 = left side

    -1 = right side
  */

  float edge;

  if (direction > 0.0) {

    edge =
      1.0 - x;

  } else {

    edge =
      x;

  }

  /*
    Only affect outer ~45%.
  */

  return smoothstep(
    0.0,
    0.48,
    edge
  );

}


/*
===========================================
MAIN
===========================================
*/

void main() {


  vec2 p =
    uv;


  /*
    Amount of deformation.

    The further you tilt,
    the stronger it becomes.
  */

  float strength =
    abs(tilt);


  /*
    Which side?

    + = left

    - = right
  */

  float direction =
    tilt >= 0.0
      ? 1.0
      : -1.0;


  /*
    Distance from affected edge.
  */

  float edge =
    direction > 0.0
      ? 1.0 - p.x
      : p.x;


  /*
    Smooth deformation zone.

    IMPORTANT:

    There is no rectangular
    cutoff anymore.
  */

  float influence =
    smoothstep(
      0.62,
      0.0,
      edge
    );


  /*
    Stronger toward the edge.
  */

  float deformation =
    influence *
    influence *
    strength;


  /*
    Stretch image outward.

    This is the key difference
    from the previous version.
  */

  float stretch =
    deformation * 0.28;


  if (direction > 0.0) {

    p.x =
      p.x -
      stretch;

  } else {

    p.x =
      p.x +
      stretch;

  }


  /*
    Slight vertical breathing
    makes the edge feel organic.
  */

  p.y +=
    sin(
      p.x * 8.0 +
      time * 0.8
    )
    *
    deformation
    *
    0.008;


  /*
    Clamp coordinates so the
    image remains visible.
  */

  p =
    clamp(
      p,
      0.001,
      0.999
    );


  /*
  =========================================
  SOFT BLUR

  Instead of placing a blur rectangle
  over the image, sample the SAME image
  several times.

  Blur increases toward the edge.
  =========================================
  */

  float blurAmount =
    deformation *
    0.025;


  vec2 texel =
    1.0 / resolution;


  vec4 color =
    texture2D(
      image,
      p
    );


  /*
    8 surrounding samples
  */

  color +=
    texture2D(
      image,
      p + vec2(
        blurAmount,
        0.0
      )
    );

  color +=
    texture2D(
      image,
      p - vec2(
        blurAmount,
        0.0
      )
    );

  color +=
    texture2D(
      image,
      p + vec2(
        0.0,
        blurAmount
      )
    );

  color +=
    texture2D(
      image,
      p - vec2(
        0.0,
        blurAmount
      )
    );

  color +=
    texture2D(
      image,
      p + vec2(
        blurAmount * 0.7,
        blurAmount * 0.7
      )
    );

  color +=
    texture2D(
      image,
      p + vec2(
        -blurAmount * 0.7,
        blurAmount * 0.7
      )
    );

  color +=
    texture2D(
      image,
      p + vec2(
        blurAmount * 0.7,
        -blurAmount * 0.7
      )
    );

  color +=
    texture2D(
      image,
      p + vec2(
        -blurAmount * 0.7,
        -blurAmount * 0.7
      )
    );


  color /=
    9.0;


  /*
  =========================================
  SOFT EDGE LIGHT
  =========================================
  */

  float edgeLight =
    deformation *
    0.12;


  color.rgb +=
    vec3(
      edgeLight
    );


  gl_FragColor =
    color;

}

`;


/* ==========================================
   SHADER CREATION
========================================== */

function createShader(
  type,
  source
) {

  const shader =
    gl.createShader(type);

  gl.shaderSource(
    shader,
    source
  );

  gl.compileShader(shader);


  if (
    !gl.getShaderParameter(
      shader,
      gl.COMPILE_STATUS
    )
  ) {

    console.error(
      gl.getShaderInfoLog(shader)
    );

  }


  return shader;

}


const vertexShader =
  createShader(
    gl.VERTEX_SHADER,
    vertexShaderSource
  );


const fragmentShader =
  createShader(
    gl.FRAGMENT_SHADER,
    fragmentShaderSource
  );


/* ==========================================
   PROGRAM
========================================== */

const program =
  gl.createProgram();

gl.attachShader(
  program,
  vertexShader
);

gl.attachShader(
  program,
  fragmentShader
);

gl.linkProgram(
  program
);

gl.useProgram(
  program
);


/* ==========================================
   FULL SCREEN TRIANGLE
========================================== */

const buffer =
  gl.createBuffer();

gl.bindBuffer(
  gl.ARRAY_BUFFER,
  buffer
);

gl.bufferData(
  gl.ARRAY_BUFFER,

  new Float32Array([
    -1, -1,
     3, -1,
    -1,  3
  ]),

  gl.STATIC_DRAW
);


const position =
  gl.getAttribLocation(
    program,
    "position"
  );

gl.enableVertexAttribArray(
  position
);

gl.vertexAttribPointer(
  position,
  2,
  gl.FLOAT,
  false,
  0,
  0
);


/* ==========================================
   UNIFORMS
========================================== */

const imageUniform =
  gl.getUniformLocation(
    program,
    "image"
  );

const resolutionUniform =
  gl.getUniformLocation(
    program,
    "resolution"
  );

const tiltUniform =
  gl.getUniformLocation(
    program,
    "tilt"
  );

const timeUniform =
  gl.getUniformLocation(
    program,
    "time"
  );


/* ==========================================
   LOAD IMAGE
========================================== */

const texture =
  gl.createTexture();

const image =
  new Image();

image.crossOrigin =
  "anonymous";


image.onload =
  function() {


    gl.bindTexture(
      gl.TEXTURE_2D,
      texture
    );


    gl.texImage2D(
      gl.TEXTURE_2D,
      0,
      gl.RGBA,
      gl.RGBA,
      gl.UNSIGNED_BYTE,
      image
    );


    gl.texParameteri(
      gl.TEXTURE_2D,
      gl.TEXTURE_MIN_FILTER,
      gl.LINEAR
    );

    gl.texParameteri(
      gl.TEXTURE_2D,
      gl.TEXTURE_MAG_FILTER,
      gl.LINEAR
    );


    gl.texParameteri(
      gl.TEXTURE_2D,
      gl.TEXTURE_WRAP_S,
      gl.CLAMP_TO_EDGE
    );

    gl.texParameteri(
      gl.TEXTURE_2D,
      gl.TEXTURE_WRAP_T,
      gl.CLAMP_TO_EDGE
    );


    gl.activeTexture(
      gl.TEXTURE0
    );

    gl.bindTexture(
      gl.TEXTURE_2D,
      texture
    );

    gl.uniform1i(
      imageUniform,
      0
    );


    resize();

    render();

  };


image.src =
  "lockscreen.png";


/* ==========================================
   RESIZE
========================================== */

function resize() {

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  canvas.width =
    window.innerWidth *
    dpr;

  canvas.height =
    window.innerHeight *
    dpr;


  canvas.style.width =
    window.innerWidth + "px";

  canvas.style.height =
    window.innerHeight + "px";


  gl.viewport(
    0,
    0,
    canvas.width,
    canvas.height
  );

}


window.addEventListener(
  "resize",
  resize
);


/* ==========================================
   MOTION
========================================== */

let targetTilt = 0;

let currentTilt = 0;


function handleMotion(
  event
) {

  const gamma =
    event.gamma || 0;


  /*
    -30° → -1

     0° →  0

    +30° → +1
  */

  targetTilt =
    Math.max(
      -1,
      Math.min(
        1,
        gamma / 30
      )
    );

}


/* ==========================================
   START
========================================== */

const start =
  document.getElementById(
    "start"
  );

const intro =
  document.getElementById(
    "intro"
  );

const hint =
  document.getElementById(
    "hint"
  );


start.addEventListener(
  "click",
  async () => {

    try {

      if (
        typeof DeviceOrientationEvent !==
        "undefined" &&

        typeof DeviceOrientationEvent
          .requestPermission ===
          "function"
      ) {

        const permission =
          await DeviceOrientationEvent
            .requestPermission();


        if (
          permission !==
          "granted"
        ) {

          start.textContent =
            "Motion Permission Denied";

          return;

        }

      }


      window.addEventListener(
        "deviceorientation",
        handleMotion
      );


      intro.classList.add(
        "hidden"
      );


      setTimeout(
        () => {

          hint.classList.add(
            "show"
          );

        },
        500
      );


      setTimeout(
        () => {

          hint.classList.remove(
            "show"
          );

        },
        4000
      );


      render();

    }
    catch(error) {

      console.error(error);

    }

  }
);


/* ==========================================
   RENDER
========================================== */

function render(
  milliseconds = 0
) {

  currentTilt +=
    (
      targetTilt -
      currentTilt
    ) * 0.075;


  gl.clearColor(
    0,
    0,
    0,
    1
  );


  gl.clear(
    gl.COLOR_BUFFER_BIT
  );


  gl.uniform2f(
    resolutionUniform,
    canvas.width,
    canvas.height
  );


  gl.uniform1f(
    tiltUniform,
    currentTilt
  );


  gl.uniform1f(
    timeUniform,
    milliseconds *
    0.001
  );


  gl.drawArrays(
    gl.TRIANGLES,
    0,
    3
  );


  requestAnimationFrame(
    render
  );

}

</script>

</body>
</html>
