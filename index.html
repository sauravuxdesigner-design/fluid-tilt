<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#000000">

<title>Spatial Lock Screen</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;
}

body {
  position: fixed;
  inset: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;
}


/* =====================================================
   SCREEN
===================================================== */

#screen {

  position: fixed;
  inset: 0;

  overflow: hidden;

  background: #000;

}


/* =====================================================
   WALLPAPER
===================================================== */

.layer {

  position: absolute;

  width: 110%;
  height: 110%;

  left: -5%;
  top: -5%;

  background-image:
    url("lockscreen.png");

  background-size: cover;

  background-position: center;

  background-repeat: no-repeat;

}


/* Main sharp image */

#main {

  z-index: 1;

  transform:
    translate3d(0, 0, 0)
    scale(1.02);

  will-change: transform;

}


/* =====================================================
   LEFT BLURRED CONTINUATION
===================================================== */

#leftBlur {

  z-index: 2;

  opacity: 0;

  filter: blur(18px);

  transform:
    translate3d(-30px, 0, 0)
    scale(1.08);

  will-change:
    transform,
    opacity;

  pointer-events: none;

  /*
    Only the LEFT part is visible.
  */

  clip-path:
    polygon(
      0 0,
      38% 0,
      38% 100%,
      0 100%
    );

}


/* =====================================================
   RIGHT BLURRED CONTINUATION
===================================================== */

#rightBlur {

  z-index: 2;

  opacity: 0;

  filter: blur(18px);

  transform:
    translate3d(30px, 0, 0)
    scale(1.08);

  will-change:
    transform,
    opacity;

  pointer-events: none;

  /*
    Only the RIGHT part is visible.
  */

  clip-path:
    polygon(
      62% 0,
      100% 0,
      100% 100%,
      62% 100%
    );

}


/* =====================================================
   SOFT EDGE LIGHT
===================================================== */

.edge {

  position: absolute;

  top: 0;

  width: 30%;

  height: 100%;

  z-index: 3;

  opacity: 0;

  pointer-events: none;

  filter: blur(35px);

}


#leftEdge {

  left: -8%;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,0.16),
      transparent
    );

}


#rightEdge {

  right: -8%;

  background:
    linear-gradient(
      270deg,
      rgba(255,255,255,0.16),
      transparent
    );

}


/* =====================================================
   DARK EDGE
===================================================== */

#vignette {

  position: absolute;

  inset: 0;

  z-index: 4;

  pointer-events: none;

  background:

    linear-gradient(
      90deg,
      rgba(0,0,0,0.20),
      transparent 15%,
      transparent 85%,
      rgba(0,0,0,0.20)
    );

}


/* =====================================================
   INTRO
===================================================== */

#intro {

  position: fixed;

  inset: 0;

  z-index: 20;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  padding: 30px;

  background:
    rgba(0,0,0,0.62);

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  color: white;

  text-align: center;

  transition:
    opacity 0.8s ease,
    visibility 0.8s ease;

}


#intro.hidden {

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

}


#intro h1 {

  margin: 0;

  font-size: 30px;

  font-weight: 500;

}


#intro p {

  max-width: 290px;

  margin:
    12px 0 25px;

  color:
    rgba(255,255,255,0.55);

  font-size: 14px;

  line-height: 1.5;

}


#start {

  border: none;

  border-radius: 30px;

  padding:
    14px 26px;

  background: white;

  color: black;

  font-size: 15px;

  font-weight: 500;

}


/* =====================================================
   HINT
===================================================== */

#hint {

  position: fixed;

  left: 50%;

  bottom:
    calc(
      35px +
      env(safe-area-inset-bottom)
    );

  z-index: 10;

  transform:
    translateX(-50%);

  color:
    rgba(255,255,255,0.55);

  font-size: 13px;

  opacity: 0;

  transition:
    opacity 1s ease;

  pointer-events: none;

}


#hint.show {

  opacity: 1;

}

</style>

</head>


<body>


<div id="screen">


  <!-- Sharp wallpaper -->

  <div
    class="layer"
    id="main">
  </div>


  <!-- Left blurred copy -->

  <div
    class="layer"
    id="leftBlur">
  </div>


  <!-- Right blurred copy -->

  <div
    class="layer"
    id="rightBlur">
  </div>


  <!-- Soft light edges -->

  <div
    class="edge"
    id="leftEdge">
  </div>


  <div
    class="edge"
    id="rightEdge">
  </div>


  <!-- Subtle vignette -->

  <div id="vignette"></div>


</div>


<!-- Permission screen -->

<div id="intro">

  <h1>
    Spatial Lock Screen
  </h1>

  <p>
    Tilt your phone left and right
    to reveal the screen continuing
    beyond the edge.
  </p>

  <button id="start">
    Begin Experience
  </button>

</div>


<div id="hint">
  Tilt left or right
</div>


<script>


/* =====================================================
   ELEMENTS
===================================================== */

const main =
  document.getElementById(
    "main"
  );

const leftBlur =
  document.getElementById(
    "leftBlur"
  );

const rightBlur =
  document.getElementById(
    "rightBlur"
  );

const leftEdge =
  document.getElementById(
    "leftEdge"
  );

const rightEdge =
  document.getElementById(
    "rightEdge"
  );

const intro =
  document.getElementById(
    "intro"
  );

const start =
  document.getElementById(
    "start"
  );

const hint =
  document.getElementById(
    "hint"
  );


/* =====================================================
   MOTION
===================================================== */

let targetTilt = 0;

let currentTilt = 0;


/* =====================================================
   START EXPERIENCE
===================================================== */

start.addEventListener(
  "click",
  async () => {

    try {

      /*
        iPhone requires permission
        from a user interaction.
      */

      if (
        typeof DeviceOrientationEvent !==
        "undefined" &&

        typeof DeviceOrientationEvent
          .requestPermission ===
          "function"
      ) {

        const permission =
          await DeviceOrientationEvent
            .requestPermission();

        if (
          permission !== "granted"
        ) {

          start.textContent =
            "Motion Permission Denied";

          return;

        }

      }


      /*
        Listen to phone movement.
      */

      window.addEventListener(
        "deviceorientation",
        handleMotion
      );


      /*
        Hide intro.
      */

      intro.classList.add(
        "hidden"
      );


      /*
        Show instruction briefly.
      */

      setTimeout(
        () => {
          hint.classList.add(
            "show"
          );
        },
        500
      );


      setTimeout(
        () => {
          hint.classList.remove(
            "show"
          );
        },
        4000
      );


      animate();


    } catch (error) {

      console.error(error);

    }

  }
);


/* =====================================================
   READ PHONE TILT
===================================================== */

function handleMotion(event) {

  /*
    gamma:

    left  = negative
    center = 0
    right = positive
  */

  const gamma =
    event.gamma || 0;


  /*
    Convert to -1 → +1.
  */

  targetTilt =
    Math.max(
      -1,
      Math.min(
        1,
        gamma / 28
      )
    );

}


/* =====================================================
   ANIMATION
===================================================== */

function animate() {


  /*
    Smooth physical movement.

    The lower this number,
    the more fluid the motion.
  */

  currentTilt +=
    (
      targetTilt -
      currentTilt
    ) * 0.075;


  /*
    Amount of tilt.

    0 = phone level
    1 = maximum right
    -1 = maximum left
  */

  const amount =
    Math.abs(
      currentTilt
    );


  /*
    =================================================
    MAIN WALLPAPER
    =================================================

    Moves slightly opposite
    to the phone tilt.
  */

  const mainMovement =
    currentTilt * -24;


  main.style.transform = `
    translate3d(
      ${mainMovement}px,
      0,
      0
    )
    scale(1.02)
  `;


  /*
    =================================================
    RIGHT TILT
    =================================================

    Phone tilts RIGHT.

    LEFT side becomes blurred.
  */

  const rightTilt =
    Math.max(
      0,
      currentTilt
    );


  leftBlur.style.opacity =
    rightTilt * 0.95;


  leftBlur.style.transform = `
    translate3d(
      ${-rightTilt * 55}px,
      0,
      0
    )
    scale(
      ${1.08 + rightTilt * 0.08}
    )
  `;


  leftEdge.style.opacity =
    rightTilt * 0.55;


  leftEdge.style.transform =
    `translateX(${-rightTilt * 25}px)`;


  /*
    =================================================
    LEFT TILT
    =================================================

    Phone tilts LEFT.

    RIGHT side becomes blurred.
  */

  const leftTilt =
    Math.max(
      0,
      -currentTilt
    );


  rightBlur.style.opacity =
    leftTilt * 0.95;


  rightBlur.style.transform = `
    translate3d(
      ${leftTilt * 55}px,
      0,
      0
    )
    scale(
      ${1.08 + leftTilt * 0.08}
    )
  `;


  rightEdge.style.opacity =
    leftTilt * 0.55;


  rightEdge.style.transform =
    `translateX(${leftTilt * 25}px)`;


  requestAnimationFrame(
    animate
  );

}

</script>


</body>
</html>
