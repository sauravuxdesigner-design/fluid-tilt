<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">

<title>Duo Lock Screen</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
}

body {
    position: fixed;
    inset: 0;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

#permission {
    position: fixed;
    inset: 0;
    z-index: 20;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: #000;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        sans-serif;

    text-align: center;
    padding: 30px;
}

#permission h1 {
    margin: 0 0 12px;
    font-size: 28px;
    font-weight: 600;
}

#permission p {
    max-width: 300px;
    margin: 0 0 26px;

    font-size: 15px;
    line-height: 1.5;

    opacity: .6;
}

#start {
    border: 0;
    border-radius: 999px;

    padding: 14px 25px;

    background: #fff;
    color: #000;

    font-size: 16px;
    font-weight: 600;
}

#recalibrate {
    position: fixed;
    z-index: 10;

    left: 50%;
    bottom: 24px;

    transform: translateX(-50%);

    border: 0;
    border-radius: 999px;

    padding: 9px 16px;

    background: rgba(0,0,0,.45);
    color: rgba(255,255,255,.8);

    backdrop-filter: blur(10px);

    font-size: 12px;

    display: none;
}
</style>
</head>

<body>

<div id="permission">

    <h1>Duo Effect</h1>

    <p>
        Hold your iPhone normally and enable motion.
        Then tilt left or right.
    </p>

    <button id="start">
        Enable Motion
    </button>

</div>

<canvas id="canvas"></canvas>

<button id="recalibrate">
    Recalibrate
</button>


<script>

/* =========================================================
   WEBGL
   ========================================================= */

const canvas =
    document.getElementById("canvas");

const gl =
    canvas.getContext("webgl", {
        alpha: false,
        antialias: false,
        premultipliedAlpha: false
    });

if (!gl) {
    alert("WebGL is not supported on this device.");
}


/* =========================================================
   VERTEX SHADER
   ========================================================= */

const vertexShaderSource = `

attribute vec2 a_position;

varying vec2 v_uv;

void main() {

    v_uv =
        a_position * 0.5 +
        0.5;

    gl_Position =
        vec4(
            a_position,
            0.0,
            1.0
        );
}

`;


/* =========================================================
   FRAGMENT SHADER
   ========================================================= */

const fragmentShaderSource = `

precision highp float;

varying vec2 v_uv;


/* Image */
uniform sampler2D u_image;


/* Screen */
uniform float u_aspect;
uniform float u_imageAspect;


/* Fold */
uniform float u_angle;
uniform float u_hinge;


/* Physical parameters */
uniform float u_eyeDistance;

uniform float u_blurPerUnit;
uniform float u_maxBlur;

uniform float u_darkenPerUnit;
uniform float u_maxDarken;


/* Pixel size */
uniform vec2 u_resolution;


/* =========================================================
   COVER IMAGE
   ========================================================= */

vec2 coverUV(vec2 uv) {

    float screenAspect =
        u_aspect;

    float imageAspect =
        u_imageAspect;

    vec2 scale =
        vec2(1.0);

    if (screenAspect > imageAspect) {

        scale.y =
            imageAspect /
            screenAspect;

    } else {

        scale.x =
            screenAspect /
            imageAspect;
    }

    return
        (uv - 0.5) *
        scale +
        0.5;
}


/* =========================================================
   IMAGE SAMPLE
   ========================================================= */

vec4 sampleImage(vec2 uv) {

    vec2 p =
        coverUV(uv);

    if (
        p.x < 0.0 ||
        p.x > 1.0 ||
        p.y < 0.0 ||
        p.y > 1.0
    ) {
        return vec4(0.0);
    }

    return texture2D(
        u_image,
        p
    );
}


/* =========================================================
   DISK BLUR

   The blur follows the warped image coordinate.
   It is NOT a rectangular overlay.
   ========================================================= */

vec4 diskBlur(
    vec2 uv,
    float radius
) {

    if (radius <= 0.00001) {

        return sampleImage(uv);
    }

    vec4 color =
        vec4(0.0);

    /*
       Convert pixel radius to UV radius.
    */

    vec2 r =
        vec2(
            radius / u_resolution.x,
            radius / u_resolution.y
        );


    /*
       Center
    */

    color +=
        sampleImage(uv)
        * 0.20;


    /*
       Cardinal samples
    */

    color +=
        sampleImage(
            uv + vec2(-r.x, 0.0)
        ) * 0.10;

    color +=
        sampleImage(
            uv + vec2(r.x, 0.0)
        ) * 0.10;

    color +=
        sampleImage(
            uv + vec2(0.0, -r.y)
        ) * 0.10;

    color +=
        sampleImage(
            uv + vec2(0.0, r.y)
        ) * 0.10;


    /*
       Diagonal samples
    */

    color +=
        sampleImage(
            uv + vec2(
                -r.x * 0.707,
                -r.y * 0.707
            )
        ) * 0.075;

    color +=
        sampleImage(
            uv + vec2(
                r.x * 0.707,
                -r.y * 0.707
            )
        ) * 0.075;

    color +=
        sampleImage(
            uv + vec2(
                -r.x * 0.707,
                r.y * 0.707
            )
        ) * 0.075;

    color +=
        sampleImage(
            uv + vec2(
                r.x * 0.707,
                r.y * 0.707
            )
        ) * 0.075;


    return color;
}


/* =========================================================
   MAIN
   ========================================================= */

void main() {

    /*
       -----------------------------------------------------
       PHYSICAL SCREEN POSITION
       -----------------------------------------------------
    */

    float x =
        (v_uv.x - 0.5) *
        u_aspect;

    float y =
        v_uv.y - 0.5;


    /*
       -----------------------------------------------------
       HINGE

       -1 = left
       +1 = right
       -----------------------------------------------------
    */

    float hingeX =
        u_hinge *
        u_aspect *
        0.5;


    /*
       Distance from hinge.

       Always positive moving from hinge toward center.
    */

    float localX =
        (x - hingeX) *
        (-u_hinge);

    localX =
        max(
            localX,
            0.0
        );


    /*
       -----------------------------------------------------
       ROTATED GLASS
       -----------------------------------------------------

       Original image plane stays at z = 0.

       Virtual glass rotates around the hinge.
    */

    float angle =
        u_angle;

    float c =
        cos(angle);

    float s =
        sin(angle);


    float glassX =
        hingeX +
        (-u_hinge) *
        localX *
        c;


    float glassZ =
        localX *
        s;


    vec3 glassPoint =
        vec3(
            glassX,
            y,
            glassZ
        );


    /*
       -----------------------------------------------------
       STATIONARY EYE
       -----------------------------------------------------
    */

    vec3 eye =
        vec3(
            0.0,
            0.0,
            u_eyeDistance
        );


    /*
       -----------------------------------------------------
       RAY
       -----------------------------------------------------
    */

    vec3 ray =
        glassPoint -
        eye;


    /*
       -----------------------------------------------------
       ZERO-ANGLE PROTECTION

       At zero tilt the glass is exactly on the original
       screen plane. We don't need an intersection.
       -----------------------------------------------------
    */

    bool flat =
        abs(angle) < 0.00001;


    vec2 sourceUV;


    if (flat) {

        /*
           Absolutely clean zero state.
        */

        sourceUV =
            v_uv;

    } else {

        /*
           Ray → original plane.
        */

        float denominator =
            ray.z;

        float t =
            -eye.z /
            denominator;

        vec3 hit =
            eye +
            ray * t;


        sourceUV =
            vec2(
                hit.x /
                    u_aspect +
                    0.5,

                hit.y +
                    0.5
            );


        /*
           -------------------------------------------------
           VALIDITY
           -------------------------------------------------
        */

        float insideX =
            step(
                -u_aspect * 0.5,
                hit.x
            ) *
            step(
                hit.x,
                u_aspect * 0.5
            );


        float insideY =
            step(
                -0.5,
                hit.y
            ) *
            step(
                hit.y,
                0.5
            );


        float valid =
            insideX *
            insideY *
            step(
                0.0,
                t
            );


        /*
           -------------------------------------------------
           GAP
           -------------------------------------------------

           Distance between virtual glass and original
           screen.
        */

        float gap =
            abs(glassZ);


        /*
           -------------------------------------------------
           BLUR
           -------------------------------------------------
        */

        float blurRadius =
            gap *
            u_blurPerUnit;

        blurRadius =
            min(
                blurRadius,
                u_maxBlur
            );


        vec4 color =
            diskBlur(
                sourceUV,
                blurRadius
            );


        /*
           -------------------------------------------------
           DARKEN
           -------------------------------------------------
        */

        float darken =
            gap *
            u_darkenPerUnit;

        darken =
            min(
                darken,
                u_maxDarken
            );


        color.rgb *=
            1.0 - darken;


        /*
           -------------------------------------------------
           BLACK ON MISS

           Soft transition rather than a hard rectangle.
           -------------------------------------------------
        */

        float miss =
            smoothstep(
                0.0,
                0.12,
                valid
            );

        color.rgb *=
            miss;


        /*
           -------------------------------------------------
           SMOOTHLY ENTER THE EFFECT
           -------------------------------------------------
        */

        float strength =
            smoothstep(
                radians(0.5),
                radians(3.0),
                abs(angle)
            );


        vec4 original =
            sampleImage(v_uv);


        color =
            mix(
                original,
                color,
                strength
            );


        gl_FragColor =
            vec4(
                color.rgb,
                1.0
            );

        return;
    }


    /*
       -----------------------------------------------------
       FLAT STATE
       -----------------------------------------------------

       This completely bypasses the fold calculation.
       Therefore the image cannot disappear at 0°.
       -----------------------------------------------------
    */

    gl_FragColor =
        sampleImage(sourceUV);
}

`;


/* =========================================================
   SHADER CREATION
   ========================================================= */

function createShader(
    type,
    source
) {

    const shader =
        gl.createShader(type);

    gl.shaderSource(
        shader,
        source
    );

    gl.compileShader(
        shader
    );

    if (
        !gl.getShaderParameter(
            shader,
            gl.COMPILE_STATUS
        )
    ) {

        console.error(
            gl.getShaderInfoLog(shader)
        );

        throw new Error(
            gl.getShaderInfoLog(shader)
        );
    }

    return shader;
}


function createProgram() {

    const vertex =
        createShader(
            gl.VERTEX_SHADER,
            vertexShaderSource
        );

    const fragment =
        createShader(
            gl.FRAGMENT_SHADER,
            fragmentShaderSource
        );

    const program =
        gl.createProgram();

    gl.attachShader(
        program,
        vertex
    );

    gl.attachShader(
        program,
        fragment
    );

    gl.linkProgram(
        program
    );

    if (
        !gl.getProgramParameter(
            program,
            gl.LINK_STATUS
        )
    ) {

        console.error(
            gl.getProgramInfoLog(program)
        );

        throw new Error(
            gl.getProgramInfoLog(program)
        );
    }

    return program;
}


const program =
    createProgram();

gl.useProgram(
    program
);


/* =========================================================
   FULLSCREEN TRIANGLE
   ========================================================= */

const buffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ARRAY_BUFFER,
    buffer
);

gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array([
        -1, -1,
         3, -1,
        -1,  3
    ]),
    gl.STATIC_DRAW
);


const positionLocation =
    gl.getAttribLocation(
        program,
        "a_position"
    );

gl.enableVertexAttribArray(
    positionLocation
);

gl.vertexAttribPointer(
    positionLocation,
    2,
    gl.FLOAT,
    false,
    0,
    0
);


/* =========================================================
   UNIFORMS
   ========================================================= */

const uniforms = {

    image:
        gl.getUniformLocation(
            program,
            "u_image"
        ),

    aspect:
        gl.getUniformLocation(
            program,
            "u_aspect"
        ),

    imageAspect:
        gl.getUniformLocation(
            program,
            "u_imageAspect"
        ),

    angle:
        gl.getUniformLocation(
            program,
            "u_angle"
        ),

    hinge:
        gl.getUniformLocation(
            program,
            "u_hinge"
        ),

    eyeDistance:
        gl.getUniformLocation(
            program,
            "u_eyeDistance"
        ),

    blurPerUnit:
        gl.getUniformLocation(
            program,
            "u_blurPerUnit"
        ),

    maxBlur:
        gl.getUniformLocation(
            program,
            "u_maxBlur"
        ),

    darkenPerUnit:
        gl.getUniformLocation(
            program,
            "u_darkenPerUnit"
        ),

    maxDarken:
        gl.getUniformLocation(
            program,
            "u_maxDarken"
        ),

    resolution:
        gl.getUniformLocation(
            program,
            "u_resolution"
        )
};


/* =========================================================
   IMAGE
   ========================================================= */

const texture =
    gl.createTexture();

const image =
    new Image();

image.onload = function() {

    gl.bindTexture(
        gl.TEXTURE_2D,
        texture
    );

    gl.pixelStorei(
        gl.UNPACK_FLIP_Y_WEBGL,
        true
    );

    gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        image
    );

    gl.texParameteri(
        gl.TEXTURE_2D,
        gl.TEXTURE_MIN_FILTER,
        gl.LINEAR
    );

    gl.texParameteri(
        gl.TEXTURE_2D,
        gl.TEXTURE_MAG_FILTER,
        gl.LINEAR
    );

    gl.texParameteri(
        gl.TEXTURE_2D,
        gl.TEXTURE_WRAP_S,
        gl.CLAMP_TO_EDGE
    );

    gl.texParameteri(
        gl.TEXTURE_2D,
        gl.TEXTURE_WRAP_T,
        gl.CLAMP_TO_EDGE
    );

    gl.activeTexture(
        gl.TEXTURE0
    );

    gl.bindTexture(
        gl.TEXTURE_2D,
        texture
    );

    gl.uniform1i(
        uniforms.image,
        0
    );

    gl.uniform1f(
        uniforms.imageAspect,
        image.width /
        image.height
    );

    resize();

    requestAnimationFrame(
        render
    );
};

image.src =
    "lockscreen.png";


/* =========================================================
   MOTION
   ========================================================= */

let rawTilt = 0;

let targetTilt = 0;

let currentTilt = 0;

let zeroTilt = 0;

let receivedSensorValue =
    false;


/* =========================================================
   DEVICE ORIENTATION
   ========================================================= */

function handleOrientation(event) {

    if (
        event.gamma === null ||
        event.gamma === undefined
    ) {
        return;
    }

    rawTilt =
        event.gamma;

    targetTilt =
        rawTilt -
        zeroTilt;

    targetTilt =
        Math.max(
            -45,
            Math.min(
                45,
                targetTilt
            )
        );

    receivedSensorValue =
        true;
}


/* =========================================================
   CALIBRATION
   ========================================================= */

function calibrate() {

    if (!receivedSensorValue) {
        return;
    }

    zeroTilt =
        rawTilt;

    targetTilt =
        0;

    currentTilt =
        0;
}


/* =========================================================
   PERMISSION
   ========================================================= */

const permission =
    document.getElementById(
        "permission"
    );

const startButton =
    document.getElementById(
        "start"
    );

const recalibrateButton =
    document.getElementById(
        "recalibrate"
    );


startButton.addEventListener(
    "click",
    async function() {

        try {

            if (
                typeof DeviceOrientationEvent !==
                "undefined" &&

                typeof DeviceOrientationEvent
                    .requestPermission ===
                "function"
            ) {

                const result =
                    await DeviceOrientationEvent
                        .requestPermission();

                if (
                    result !==
                    "granted"
                ) {

                    alert(
                        "Motion permission was not granted."
                    );

                    return;
                }
            }


            window.addEventListener(
                "deviceorientation",
                handleOrientation,
                true
            );


            permission.style.display =
                "none";


            recalibrateButton.style.display =
                "block";


            /*
               Wait for the first sensor value.
            */

            setTimeout(
                function() {

                    calibrate();

                },
                500
            );

        } catch (error) {

            console.error(error);

            alert(
                "Could not enable motion."
            );
        }
    }
);


/* =========================================================
   RECALIBRATE
   ========================================================= */

recalibrateButton.addEventListener(
    "click",
    function() {

        calibrate();

    }
);


/* =========================================================
   DESKTOP TESTING
   ========================================================= */

let dragging =
    false;


window.addEventListener(
    "pointerdown",
    function() {

        dragging =
            true;

    }
);


window.addEventListener(
    "pointerup",
    function() {

        dragging =
            false;

    }
);


window.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging) {
            return;
        }

        const x =
            event.clientX /
            window.innerWidth;

        targetTilt =
            (x - 0.5) *
            90;
    }
);


/* =========================================================
   RESIZE
   ========================================================= */

function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.round(
            window.innerWidth *
            dpr
        );

    canvas.height =
        Math.round(
            window.innerHeight *
            dpr
        );

    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );


    gl.uniform1f(
        uniforms.aspect,
        window.innerWidth /
        window.innerHeight
    );


    gl.uniform2f(
        uniforms.resolution,
        canvas.width,
        canvas.height
    );
}


window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   RENDER LOOP
   ========================================================= */

function render() {

    /*
       Smooth physical movement.
    */

    currentTilt +=
        (
            targetTilt -
            currentTilt
        ) * 0.09;


    /*
       Degrees → radians
    */

    const angle =
        currentTilt *
        Math.PI /
        180;


    /*
       Hinge:

       Right tilt  → LEFT hinge
       Left tilt   → RIGHT hinge
    */

    const hinge =
        currentTilt >= 0
            ? -1
            : 1;


    /*
       Physical/reference parameters.

       These correspond to the tuning values used
       by the Android DuoFold implementation.
    */

    gl.uniform1f(
        uniforms.angle,
        angle
    );

    gl.uniform1f(
        uniforms.hinge,
        hinge
    );


    /*
       Viewing distance.

       Normalized equivalent of the reference's
       approximately 320 mm.
    */

    gl.uniform1f(
        uniforms.eyeDistance,
        2.8
    );


    /*
       Blur:
       0.55 equivalent tuning.
    */

    gl.uniform1f(
        uniforms.blurPerUnit,
        0.55
    );

    gl.uniform1f(
        uniforms.maxBlur,
        24.0
    );


    /*
       Darkening:
       0.012 equivalent tuning.
    */

    gl.uniform1f(
        uniforms.darkenPerUnit,
        0.012
    );

    gl.uniform1f(
        uniforms.maxDarken,
        0.55
    );


    /*
       Draw.
    */

    gl.drawArrays(
        gl.TRIANGLES,
        0,
        3
    );


    requestAnimationFrame(
        render
    );
}

</script>

</body>
</html>
