<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#000000">

<title>Spatial Lock Screen</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;
}

body {
  position: fixed;
  inset: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;
}


/* =====================================
   MAIN SCREEN
===================================== */

#screen {

  position: fixed;

  inset: 0;

  overflow: hidden;

  background: #111;

}


/* =====================================
   WALLPAPER
===================================== */

#wallpaper {

  position: absolute;

  width: 115%;
  height: 115%;

  left: -7.5%;
  top: -7.5%;

  /*
    Temporary wallpaper.

    We'll replace this with your
    actual wallpaper image later.
  */

  background:

    radial-gradient(
      ellipse at 70% 75%,
      #e8d6b5 0%,
      #c9b58e 25%,
      transparent 55%
    ),

    radial-gradient(
      ellipse at 25% 35%,
      #7d8791 0%,
      #4f5964 35%,
      transparent 65%
    ),

    linear-gradient(
      150deg,
      #596774 0%,
      #92948e 35%,
      #d7ccb5 65%,
      #eee6d3 100%
    );

  background-size: cover;

  transform:
    translate3d(0,0,0)
    scale(1.03);

  will-change: transform;

  transition: none;
}


/* =====================================
   LEFT BLUR
===================================== */

.blur-left {

  position: absolute;

  left: -5%;
  top: -10%;

  width: 38%;
  height: 120%;

  background: inherit;

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  filter: blur(12px);

  opacity: 0;

  transform:
    translateX(-30px)
    scale(1.15);

  pointer-events: none;

  will-change:
    opacity,
    transform;

}


/* =====================================
   RIGHT BLUR
===================================== */

.blur-right {

  position: absolute;

  right: -5%;
  top: -10%;

  width: 38%;
  height: 120%;

  background: inherit;

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  filter: blur(12px);

  opacity: 0;

  transform:
    translateX(30px)
    scale(1.15);

  pointer-events: none;

  will-change:
    opacity,
    transform;

}


/* =====================================
   BLUR FADE MASKS
===================================== */

.blur-left {

  -webkit-mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 30%,
      transparent 100%
    );

  mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 30%,
      transparent 100%
    );
}


.blur-right {

  -webkit-mask-image:
    linear-gradient(
      to left,
      black 0%,
      black 30%,
      transparent 100%
    );

  mask-image:
    linear-gradient(
      to left,
      black 0%,
      black 30%,
      transparent 100%
    );
}


/* =====================================
   SUBTLE DARK EDGE
===================================== */

#edge {

  position: absolute;

  inset: 0;

  pointer-events: none;

  background:

    linear-gradient(
      90deg,
      rgba(0,0,0,0.20),
      transparent 15%,
      transparent 85%,
      rgba(0,0,0,0.20)
    );

}


/* =====================================
   CLOCK
===================================== */

#clock {

  position: absolute;

  top: 9vh;

  left: 50%;

  transform:
    translateX(-50%);

  color: white;

  text-align: center;

  z-index: 5;

  white-space: nowrap;

  text-shadow:
    0 3px 20px rgba(0,0,0,0.18);

}


#time {

  font-size:
    clamp(
      76px,
      19vw,
      155px
    );

  font-weight: 200;

  letter-spacing: -6px;

  line-height: 0.9;
}


#date {

  margin-top: 14px;

  font-size: 17px;

  font-weight: 500;

}


/* =====================================
   BOTTOM CONTROLS
===================================== */

#controls {

  position: absolute;

  z-index: 5;

  bottom:
    calc(
      30px +
      env(safe-area-inset-bottom)
    );

  left: 50%;

  transform:
    translateX(-50%);

  display: flex;

  gap: 22px;

}


.control {

  width: 54px;
  height: 54px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background:
    rgba(
      255,
      255,
      255,
      0.25
    );

  backdrop-filter:
    blur(15px);

  -webkit-backdrop-filter:
    blur(15px);

  color: white;

  font-size: 20px;

}


/* =====================================
   START SCREEN
===================================== */

#intro {

  position: fixed;

  inset: 0;

  z-index: 20;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  background:
    rgba(0,0,0,0.65);

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  color: white;

  transition:
    opacity 0.7s ease;

}


#intro.hidden {

  opacity: 0;

  pointer-events: none;

}


#intro h1 {

  margin: 0;

  font-size: 30px;

  font-weight: 500;

}


#intro p {

  width: 280px;

  margin: 12px 0 25px;

  color:
    rgba(255,255,255,0.55);

  font-size: 14px;

  line-height: 1.5;

  text-align: center;

}


#start {

  padding:
    14px 25px;

  border: 0;

  border-radius: 30px;

  background: white;

  color: black;

  font-size: 15px;

  font-weight: 500;

}


/* =====================================
   TILT INDICATOR
===================================== */

#hint {

  position: fixed;

  z-index: 10;

  bottom:
    calc(
      105px +
      env(safe-area-inset-bottom)
    );

  left: 50%;

  transform:
    translateX(-50%);

  color:
    rgba(255,255,255,0.45);

  font-size: 13px;

  opacity: 0;

  transition:
    opacity 1s ease;

}


#hint.show {

  opacity: 1;

}

</style>

</head>


<body>


<div id="screen">


  <!-- Wallpaper -->

  <div id="wallpaper"></div>


  <!-- Blurred continuation -->

  <div
    class="blur-left"
    id="blurLeft">
  </div>


  <div
    class="blur-right"
    id="blurRight">
  </div>


  <!-- Screen edge -->

  <div id="edge"></div>


  <!-- Clock -->

  <div id="clock">

    <div id="time">
      9:41
    </div>

    <div id="date">
      Wednesday, April 1
    </div>

  </div>


  <!-- Bottom controls -->

  <div id="controls">

    <div class="control">
      🔦
    </div>

    <div class="control">
      📷
    </div>

  </div>


</div>


<!-- Permission -->

<div id="intro">

  <h1>
    Spatial Lock Screen
  </h1>

  <p>
    Tilt your phone and watch the
    wallpaper continue beyond the screen.
  </p>

  <button id="start">
    Begin Experience
  </button>

</div>


<div id="hint">
  Tilt left or right
</div>


<script>


const wallpaper =
  document.getElementById(
    "wallpaper"
  );


const blurLeft =
  document.getElementById(
    "blurLeft"
  );


const blurRight =
  document.getElementById(
    "blurRight"
  );


const intro =
  document.getElementById(
    "intro"
  );


const start =
  document.getElementById(
    "start"
  );


const hint =
  document.getElementById(
    "hint"
  );


/* =====================================
   MOTION VALUES
===================================== */

let targetTilt = 0;

let currentTilt = 0;


/* =====================================
   START
===================================== */

start.addEventListener(
  "click",
  async () => {

    try {

      /*
        iPhone permission
      */

      if (
        typeof DeviceOrientationEvent !==
        "undefined" &&

        typeof DeviceOrientationEvent
          .requestPermission ===
          "function"
      ) {

        const permission =
          await DeviceOrientationEvent
            .requestPermission();


        if (
          permission !== "granted"
        ) {

          return;

        }

      }


      /*
        Start motion
      */

      window.addEventListener(
        "deviceorientation",
        handleMotion
      );


      /*
        Hide intro
      */

      intro.classList.add(
        "hidden"
      );


      /*
        Show hint
      */

      setTimeout(
        () => {
          hint.classList.add(
            "show"
          );
        },
        600
      );


      setTimeout(
        () => {
          hint.classList.remove(
            "show"
          );
        },
        4000
      );


      animate();


    } catch (error) {

      console.error(error);

    }

  }
);


/* =====================================
   DEVICE TILT
===================================== */

function handleMotion(
  event
) {

  const gamma =
    event.gamma || 0;


  /*
    Convert:

    -35° → -1
     0°  →  0
    +35° → +1
  */

  targetTilt =
    Math.max(
      -1,
      Math.min(
        1,
        gamma / 35
      )
    );

}


/* =====================================
   ANIMATION
===================================== */

function animate() {


  /*
    Smooth movement

    This creates inertia.
  */

  currentTilt +=
    (
      targetTilt -
      currentTilt
    ) * 0.07;


  /*
    Convert tilt to pixels
  */

  const movement =
    currentTilt * 45;


  /*
    Wallpaper shifts slightly
    opposite to the phone movement.
  */

  wallpaper.style.transform = `
    translate3d(
      ${-movement}px,
      0,
      0
    )
    scale(1.03)
  `;


  /*
    ====================================
    TILT RIGHT
    ====================================

    currentTilt > 0

    Blur appears on LEFT.
  */

  const rightTilt =
    Math.max(
      0,
      currentTilt
    );


  blurLeft.style.opacity =
    rightTilt * 0.95;


  blurLeft.style.transform = `
    translateX(
      ${-rightTilt * 35}px
    )
    scale(1.15)
  `;


  /*
    ====================================
    TILT LEFT
    ====================================

    currentTilt < 0

    Blur appears on RIGHT.
  */

  const leftTilt =
    Math.max(
      0,
      -currentTilt
    );


  blurRight.style.opacity =
    leftTilt * 0.95;


  blurRight.style.transform = `
    translateX(
      ${leftTilt * 35}px
    )
    scale(1.15)
  `;


  requestAnimationFrame(
    animate
  );

}


/* =====================================
   REAL CLOCK
===================================== */

function updateClock() {

  const now =
    new Date();


  let hours =
    now.getHours();


  let minutes =
    now.getMinutes();


  hours =
    hours
      .toString()
      .padStart(2, "0");


  minutes =
    minutes
      .toString()
      .padStart(2, "0");


  document.getElementById(
    "time"
  ).textContent =
    `${hours}:${minutes}`;


  document.getElementById(
    "date"
  ).textContent =
    now.toLocaleDateString(
      undefined,
      {
        weekday: "long",
        month: "long",
        day: "numeric"
      }
    );

}


updateClock();


setInterval(
  updateClock,
  1000
);

</script>


</body>
</html>
