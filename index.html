<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Duo Lock Screen</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: none;
    }

    body {
        position: fixed;
        inset: 0;
    }

    canvas {
        width: 100%;
        height: 100%;
        display: block;
    }

    #permission {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #000;
        color: white;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        font-family: -apple-system, BlinkMacSystemFont,
                     "SF Pro Display", sans-serif;

        text-align: center;
        padding: 30px;
    }

    #permission h1 {
        font-size: 28px;
        margin: 0 0 12px;
        font-weight: 600;
    }

    #permission p {
        font-size: 16px;
        line-height: 1.5;
        opacity: .65;
        max-width: 300px;
        margin: 0 0 28px;
    }

    #start {
        border: 0;
        border-radius: 999px;
        padding: 14px 24px;
        font-size: 17px;
        font-weight: 600;
        background: white;
        color: black;
    }

    #status {
        position: fixed;
        bottom: 20px;
        left: 0;
        right: 0;

        z-index: 5;

        text-align: center;
        color: white;
        opacity: .35;

        font-family: -apple-system, BlinkMacSystemFont,
                     "SF Pro Display", sans-serif;

        font-size: 12px;

        pointer-events: none;
    }
</style>
</head>

<body>

<div id="permission">
    <h1>Duo Lock Screen</h1>
    <p>
        Tilt your iPhone to create the smooth
        Duo-style screen deformation.
    </p>

    <button id="start">
        Enable Motion
    </button>
</div>

<canvas id="canvas"></canvas>

<div id="status">0°</div>

<script>

const canvas = document.getElementById("canvas");
const gl = canvas.getContext("webgl", {
    alpha: false,
    antialias: false,
    preserveDrawingBuffer: false
});

if (!gl) {
    alert("WebGL is not supported on this device.");
}


/* =========================================================
   VERTEX SHADER
   ========================================================= */

const vertexShaderSource = `
attribute vec2 a_position;

varying vec2 v_uv;

void main() {

    v_uv = a_position * 0.5 + 0.5;

    gl_Position = vec4(a_position, 0.0, 1.0);
}
`;


/* =========================================================
   FRAGMENT SHADER
   ========================================================= */

const fragmentShaderSource = `

precision highp float;

varying vec2 v_uv;

uniform sampler2D u_image;

uniform float u_tilt;
uniform float u_aspect;
uniform float u_imageAspect;


/*
    Virtual camera distance.

    Larger = weaker deformation.
    Smaller = stronger deformation.
*/
uniform float u_eyeDistance;


/*
    Maximum blur.
*/
uniform float u_maxBlur;


/*
    Amount of darkening around the fold.
*/
uniform float u_maxDarken;


/* ---------------------------------------------------------
   Cover mapping
   --------------------------------------------------------- */

vec2 coverUV(vec2 uv) {

    float screenAspect = u_aspect;
    float imageAspect = u_imageAspect;

    vec2 scale = vec2(1.0);

    if (screenAspect > imageAspect) {

        scale.y = imageAspect / screenAspect;

    } else {

        scale.x = screenAspect / imageAspect;
    }

    vec2 result = (uv - 0.5) * scale + 0.5;

    return result;
}


/* ---------------------------------------------------------
   Image sampling
   --------------------------------------------------------- */

vec4 sampleImage(vec2 uv) {

    vec2 imageUV = coverUV(uv);

    /*
       Outside image = black.
    */
    if (
        imageUV.x < 0.0 ||
        imageUV.x > 1.0 ||
        imageUV.y < 0.0 ||
        imageUV.y > 1.0
    ) {
        return vec4(0.0);
    }

    return texture2D(u_image, imageUV);
}


/* ---------------------------------------------------------
   Soft disk blur

   This is intentionally applied to the warped
   image coordinate, NOT as a rectangular overlay.
   --------------------------------------------------------- */

vec4 blurredSample(vec2 uv, float radius) {

    if (radius <= 0.001) {
        return sampleImage(uv);
    }

    vec4 color = vec4(0.0);

    float r = radius;

    color += sampleImage(uv + vec2(-r, 0.0)) * 0.10;
    color += sampleImage(uv + vec2( r, 0.0)) * 0.10;

    color += sampleImage(uv + vec2(0.0, -r)) * 0.10;
    color += sampleImage(uv + vec2(0.0,  r)) * 0.10;

    color += sampleImage(uv + vec2(-r, -r)) * 0.08;
    color += sampleImage(uv + vec2( r, -r)) * 0.08;
    color += sampleImage(uv + vec2(-r,  r)) * 0.08;
    color += sampleImage(uv + vec2( r,  r)) * 0.08;

    color += sampleImage(uv + vec2(-r * 0.5, 0.0)) * 0.07;
    color += sampleImage(uv + vec2( r * 0.5, 0.0)) * 0.07;

    color += sampleImage(uv + vec2(0.0, -r * 0.5)) * 0.07;
    color += sampleImage(uv + vec2(0.0,  r * 0.5)) * 0.07;

    return color;
}


/* ---------------------------------------------------------
   MAIN
   --------------------------------------------------------- */

void main() {

    vec2 uv = v_uv;

    /*
       Convert screen to physical-ish coordinates.

       x is centered around 0.
       y is centered around 0.
    */

    float x = (uv.x - 0.5) * u_aspect;
    float y = uv.y - 0.5;


    /*
       Tilt comes from iPhone gyroscope.

       Positive tilt:
           left side becomes the folded side.

       Negative tilt:
           right side becomes the folded side.
    */

    float angle = radians(u_tilt);

    float absAngle = abs(angle);

    /*
       Don't allow extreme angles.
    */
    absAngle = min(absAngle, radians(55.0));


    /*
       Which edge becomes the hinge?
    */

    float hinge;

    if (angle >= 0.0) {
        hinge = -u_aspect * 0.5;
    } else {
        hinge = u_aspect * 0.5;
    }


    /*
       Direction from hinge toward the center.
    */

    float direction;

    if (angle >= 0.0) {
        direction = 1.0;
    } else {
        direction = -1.0;
    }


    /*
       Distance along the virtual glass.
    */

    float distanceFromHinge =
        (x - hinge) * direction;


    /*
       If something is wrong with the coordinate,
       keep it stable.
    */

    distanceFromHinge =
        max(distanceFromHinge, 0.0);


    /*
       -----------------------------------------------------
       ROTATED GLASS
       -----------------------------------------------------

       This is the important part.

       Instead of putting a blur rectangle over the image,
       we actually calculate where the tilted glass exists
       in 3D space.
    */

    float glassX =
        hinge +
        direction *
        cos(absAngle) *
        distanceFromHinge;

    float glassZ =
        sin(absAngle) *
        distanceFromHinge;


    /*
       Virtual eye / camera.

       The viewer is looking toward the phone.
    */

    vec3 eye =
        vec3(0.0, 0.0, u_eyeDistance);


    /*
       Point on rotated glass.
    */

    vec3 glassPoint =
        vec3(glassX, y, glassZ);


    /*
       Ray from eye → glass.
    */

    vec3 ray =
        glassPoint - eye;


    /*
       Intersection with original screen plane.

       Original screen plane is z = 0.
    */

    float denominator = ray.z;

    float t = 0.0;

    if (abs(denominator) > 0.00001) {

        t = -eye.z / denominator;

    } else {

        t = 1.0;
    }


    /*
       Where does this ray hit the original image?
    */

    vec3 hit =
        eye + ray * t;


    /*
       Convert back into UV coordinates.
    */

    float sourceX =
        hit.x / u_aspect + 0.5;

    float sourceY =
        hit.y + 0.5;


    vec2 sourceUV =
        vec2(sourceX, sourceY);


    /*
       -----------------------------------------------------
       GAP
       -----------------------------------------------------

       The farther the virtual glass is from the original
       screen plane, the more blur/darkening we introduce.
    */

    float gap =
        abs(glassZ);


    /*
       Normalize the gap.
    */

    float gapFactor =
        smoothstep(
            0.0,
            u_aspect * 0.45,
            gap
        );


    /*
       Blur increases smoothly with the physical gap.
    */

    float blurAmount =
        gapFactor * u_maxBlur;


    /*
       Convert blur from pixels-ish into UV units.
    */

    float blurUV =
        blurAmount / 900.0;


    /*
       Sample the warped image.
    */

    vec4 color =
        blurredSample(
            sourceUV,
            blurUV
        );


    /*
       -----------------------------------------------------
       DARKENING
       -----------------------------------------------------
    */

    float darken =
        gapFactor * u_maxDarken;

    color.rgb *=
        1.0 - darken;


    /*
       -----------------------------------------------------
       MISS AREA
       -----------------------------------------------------

       If the ray does not intersect the original screen,
       fade toward black.

       This gives the deep folded edge.
    */

    float valid =
        step(0.0, t) *
        step(t, 1.0) *
        step(-u_aspect * 0.5, hit.x) *
        step(hit.x, u_aspect * 0.5) *
        step(-0.5, hit.y) *
        step(hit.y, 0.5);


    /*
       Smooth edge rather than a hard rectangle.
    */

    float edgeFade =
        smoothstep(
            -0.08,
            0.05,
            valid
        );


    color.rgb *= edgeFade;


    /*
       At zero tilt we want the original image to be
       completely untouched.
    */

    float tiltAmount =
        smoothstep(
            radians(0.5),
            radians(4.0),
            absAngle
        );


    vec4 original =
        sampleImage(uv);


    color =
        mix(
            original,
            color,
            tiltAmount
        );


    gl_FragColor =
        vec4(color.rgb, 1.0);
}
`;


/* =========================================================
   SHADER HELPERS
   ========================================================= */

function createShader(type, source) {

    const shader = gl.createShader(type);

    gl.shaderSource(shader, source);

    gl.compileShader(shader);

    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {

        console.error(
            gl.getShaderInfoLog(shader)
        );

        throw new Error(
            gl.getShaderInfoLog(shader)
        );
    }

    return shader;
}


function createProgram(vertexSource, fragmentSource) {

    const vertexShader =
        createShader(
            gl.VERTEX_SHADER,
            vertexSource
        );

    const fragmentShader =
        createShader(
            gl.FRAGMENT_SHADER,
            fragmentSource
        );

    const program =
        gl.createProgram();

    gl.attachShader(
        program,
        vertexShader
    );

    gl.attachShader(
        program,
        fragmentShader
    );

    gl.linkProgram(program);

    if (!gl.getProgramParameter(
        program,
        gl.LINK_STATUS
    )) {

        console.error(
            gl.getProgramInfoLog(program)
        );

        throw new Error(
            gl.getProgramInfoLog(program)
        );
    }

    return program;
}


const program =
    createProgram(
        vertexShaderSource,
        fragmentShaderSource
    );

gl.useProgram(program);


/* =========================================================
   FULL SCREEN TRIANGLE
   ========================================================= */

const buffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ARRAY_BUFFER,
    buffer
);

gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array([
        -1, -1,
         3, -1,
        -1,  3
    ]),
    gl.STATIC_DRAW
);


const positionLocation =
    gl.getAttribLocation(
        program,
        "a_position"
    );

gl.enableVertexAttribArray(
    positionLocation
);

gl.vertexAttribPointer(
    positionLocation,
    2,
    gl.FLOAT,
    false,
    0,
    0
);


/* =========================================================
   UNIFORMS
   ========================================================= */

const uImage =
    gl.getUniformLocation(
        program,
        "u_image"
    );

const uTilt =
    gl.getUniformLocation(
        program,
        "u_tilt"
    );

const uAspect =
    gl.getUniformLocation(
        program,
        "u_aspect"
    );

const uImageAspect =
    gl.getUniformLocation(
        program,
        "u_imageAspect"
    );

const uEyeDistance =
    gl.getUniformLocation(
        program,
        "u_eyeDistance"
    );

const uMaxBlur =
    gl.getUniformLocation(
        program,
        "u_maxBlur"
    );

const uMaxDarken =
    gl.getUniformLocation(
        program,
        "u_maxDarken"
    );


/* =========================================================
   IMAGE
   ========================================================= */

const image =
    new Image();

image.src = "lockscreen.png";


const texture =
    gl.createTexture();

image.onload = () => {

    gl.bindTexture(
        gl.TEXTURE_2D,
        texture
    );

    gl.pixelStorei(
        gl.UNPACK_FLIP_Y_WEBGL,
        true
    );

    gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        image
    );

    gl.texParameteri(
        gl.TEXTURE_2D,
        gl.TEXTURE_MIN_FILTER,
        gl.LINEAR
    );

    gl.texParameteri(
        gl.TEXTURE_2D,
        gl.TEXTURE_MAG_FILTER,
        gl.LINEAR
    );

    gl.texParameteri(
        gl.TEXTURE_2D,
        gl.TEXTURE_WRAP_S,
        gl.CLAMP_TO_EDGE
    );

    gl.texParameteri(
        gl.TEXTURE_2D,
        gl.TEXTURE_WRAP_T,
        gl.CLAMP_TO_EDGE
    );

    gl.activeTexture(
        gl.TEXTURE0
    );

    gl.bindTexture(
        gl.TEXTURE_2D,
        texture
    );

    gl.uniform1i(
        uImage,
        0
    );

    gl.uniform1f(
        uImageAspect,
        image.width / image.height
    );

    resize();

    requestAnimationFrame(render);
};


/* =========================================================
   MOTION
   ========================================================= */

let currentTilt = 0;
let targetTilt = 0;

let motionStarted = false;


/*
   iPhone tilt.

   gamma:
       left/right tilt

   Positive gamma = phone tilted right.
*/

function handleOrientation(event) {

    if (event.gamma == null) {
        return;
    }

    targetTilt =
        Math.max(
            -55,
            Math.min(
                55,
                event.gamma
            )
        );
}


/* =========================================================
   DESKTOP TESTING
   ========================================================= */

let pointerActive = false;

window.addEventListener(
    "pointerdown",
    () => {
        pointerActive = true;
    }
);

window.addEventListener(
    "pointerup",
    () => {
        pointerActive = false;
    }
);

window.addEventListener(
    "pointermove",
    event => {

        if (!pointerActive) {
            return;
        }

        const x =
            event.clientX /
            window.innerWidth;

        targetTilt =
            (x - 0.5) * 110;
    }
);


/* =========================================================
   MOTION PERMISSION
   ========================================================= */

const permission =
    document.getElementById(
        "permission"
    );

const startButton =
    document.getElementById(
        "start"
    );

startButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                typeof DeviceOrientationEvent !==
                "undefined" &&
                typeof DeviceOrientationEvent.requestPermission ===
                "function"
            ) {

                const result =
                    await DeviceOrientationEvent
                        .requestPermission();

                if (result !== "granted") {

                    alert(
                        "Motion permission was not granted."
                    );

                    return;
                }
            }

            window.addEventListener(
                "deviceorientation",
                handleOrientation,
                true
            );

            motionStarted = true;

            permission.style.display =
                "none";

        } catch (error) {

            console.error(error);

            alert(
                "Could not enable motion."
            );
        }
    }
);


/* =========================================================
   RESIZE
   ========================================================= */

function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        window.innerWidth * dpr;

    canvas.height =
        window.innerHeight * dpr;

    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const aspect =
        window.innerWidth /
        window.innerHeight;

    gl.uniform1f(
        uAspect,
        aspect
    );
}

window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   RENDER LOOP
   ========================================================= */

function render() {

    /*
       Smooth physical movement.

       This is important.
       We don't directly use the sensor value.
    */

    currentTilt +=
        (targetTilt - currentTilt)
        * 0.10;


    /*
       Update shader.
    */

    gl.uniform1f(
        uTilt,
        currentTilt
    );


    /*
       Android reference uses roughly 320mm
       viewing distance.

       In our normalized WebGL model,
       2.8 gives a similar visual behavior.
    */

    gl.uniform1f(
        uEyeDistance,
        2.8
    );


    /*
       Blur tuning.
    */

    gl.uniform1f(
        uMaxBlur,
        24.0
    );


    /*
       Fold darkening.
    */

    gl.uniform1f(
        uMaxDarken,
        0.48
    );


    gl.drawArrays(
        gl.TRIANGLES,
        0,
        3
    );


    document.getElementById(
        "status"
    ).textContent =
        Math.round(currentTilt) + "°";


    requestAnimationFrame(
        render
    );
}

</script>

</body>
</html>
