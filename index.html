<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Motion</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      left: 50%;
      top: 50%;

      width: 230px;
      height: 230px;

      margin-left: -115px;
      margin-top: -115px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 28%,
          #ffffff 0%,
          #d9faff 7%,
          #72dfff 18%,
          #168cff 42%,
          #0047ff 65%,
          rgba(0, 71, 255, 0) 80%
        );

      filter: blur(17px);

      will-change: transform;
    }

    .blob:nth-child(2) {
      width: 210px;
      height: 210px;
      margin-left: -105px;
      margin-top: -105px;
      opacity: 0.65;
      filter: blur(22px);
    }

    .blob:nth-child(3) {
      width: 180px;
      height: 180px;
      margin-left: -90px;
      margin-top: -90px;
      opacity: 0.4;
      filter: blur(28px);
    }

    #motionButton {
      position: fixed;
      z-index: 20;

      top: 30px;
      left: 50%;

      transform: translateX(-50%);

      padding: 12px 20px;

      border: 0;
      border-radius: 30px;

      background: white;
      color: black;

      font-size: 16px;
    }
  </style>
</head>

<body>

  <div id="scene">

    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>

  </div>

  <button id="motionButton">
    Enable Motion
  </button>


  <script>

    const blobs =
      document.querySelectorAll(".blob");

    const button =
      document.getElementById("motionButton");


    /*
      Each blob has its own
      delayed position.
    */

    const positions = [
      { x: 0, y: 0 },
      { x: 0, y: 0 },
      { x: 0, y: 0 }
    ];


    let targetX = 0;
    let targetY = 0;

    let velocityX = 0;
    let velocityY = 0;


    button.addEventListener(
      "click",
      async () => {

        if (
          typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function"
        ) {

          try {

            const permission =
              await DeviceOrientationEvent.requestPermission();

            if (permission === "granted") {

              startMotion();

              button.textContent =
                "Motion Enabled";

            } else {

              button.textContent =
                "Permission Denied";

            }

          } catch (error) {

            console.error(error);

            button.textContent =
              "Motion Error";

          }

        } else {

          startMotion();

          button.textContent =
            "Motion Enabled";

        }

      }
    );


    function startMotion() {

      window.addEventListener(
        "deviceorientation",
        (event) => {

          const gamma =
            event.gamma || 0;

          const beta =
            event.beta || 0;


          /*
            Horizontal movement
          */

          const horizontal =
            Math.max(
              -1,
              Math.min(1, gamma / 30)
            );


          /*
            Vertical movement
          */

          const vertical =
            Math.max(
              -1,
              Math.min(1, (beta - 45) / 30)
            );


          targetX =
            horizontal * 260;

          targetY =
            vertical * 100;

        }
      );


      animate();

    }


    function animate() {

      /*
        Main blob
      */

      positions[0].x +=
        (targetX - positions[0].x) * 0.12;

      positions[0].y +=
        (targetY - positions[0].y) * 0.12;


      /*
        Second blob follows slower
      */

      positions[1].x +=
        (positions[0].x - positions[1].x) * 0.08;

      positions[1].y +=
        (positions[0].y - positions[1].y) * 0.08;


      /*
        Third blob follows even slower
      */

      positions[2].x +=
        (positions[1].x - positions[2].x) * 0.05;

      positions[2].y +=
        (positions[1].y - positions[2].y) * 0.05;


      /*
        Calculate velocity.

        This gives us the feeling
        of liquid being pulled.
      */

      velocityX =
        positions[0].x - positions[1].x;

      velocityY =
        positions[0].y - positions[1].y;


      const stretch =
        Math.min(
          1.45,
          1 + Math.abs(velocityX) * 0.004
        );


      const squash =
        Math.max(
          0.72,
          1 - Math.abs(velocityX) * 0.0015
        );


      /*
        Main blob
      */

      blobs[0].style.transform = `
        translate(
          ${positions[0].x}px,
          ${positions[0].y}px
        )
        scaleX(${stretch})
        scaleY(${squash})
      `;


      /*
        Middle liquid
      */

      blobs[1].style.transform = `
        translate(
          ${positions[1].x}px,
          ${positions[1].y}px
        )
        scaleX(${1 + stretch * 0.15})
        scaleY(${1 - (stretch - 1) * 0.2})
      `;


      /*
        Outer liquid trail
      */

      blobs[2].style.transform = `
        translate(
          ${positions[2].x}px,
          ${positions[2].y}px
        )
        scaleX(${1 + stretch * 0.08})
        scaleY(${1 - (stretch - 1) * 0.15})
      `;


      requestAnimationFrame(animate);

    }

  </script>

</body>
</html>
